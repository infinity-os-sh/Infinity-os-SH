<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- A19's lesson, applied from the start: 48px targets and safe-area insets. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HEMA Pre-Wired Runtime Harness v0.1 — 预通电运行台</title>
<style>
:root{
  --bg:#0b1016;--panel:#131a24;--panel2:#1a222e;--line:#25303d;
  --ink:#e6ecf5;--dim:#8d9aad;--accent:#4d8dff;
  --ok:#34d399;--warn:#f0b429;--stop:#f0685f;--hold:#a78bfa;--syn:#ff9d3d;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tap:48px;--safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--ui);
  font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#banner{position:sticky;top:0;z-index:50;padding:10px 18px;text-align:center;font-weight:700;
  letter-spacing:.05em;font-size:12.5px;border-bottom:2px solid var(--syn);color:var(--syn);
  background:repeating-linear-gradient(45deg,#3a2409,#3a2409 12px,#452b0b 12px,#452b0b 24px)}
header{padding:14px 20px 0}h1{font-size:17px;margin:0}
.sub{color:var(--dim);font-size:12px;margin-top:4px}
nav{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
button{font-family:inherit;font-size:13px;min-height:var(--tap);background:var(--panel2);
  color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:0 14px;cursor:pointer}
button.primary{background:#1d3a6b;border-color:#2f5ca8}
button:disabled{opacity:.45;cursor:not-allowed}
nav button{color:var(--dim);white-space:nowrap}
nav button.on{background:#1d3a6b;border-color:#2f5ca8;color:#fff}
main{padding:16px 20px calc(110px + var(--safe));display:grid;gap:16px}
section{display:none}section.on{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.panel>h2{margin:0;padding:11px 14px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid var(--line);background:var(--panel2)}
.panel .body{padding:13px 14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
code{font-family:var(--mono);font-size:11.5px;color:#c4d2ea}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid transparent;white-space:nowrap}
.p-ok{background:#0f2e21;color:var(--ok);border-color:#1d5c43}
.p-warn{background:#33270c;color:var(--warn);border-color:#6b5318}
.p-stop{background:#331416;color:var(--stop);border-color:#6b2a2e}
.p-hold{background:#241c3d;color:var(--hold);border-color:#443a72}
.p-dim{background:#1e222b;color:var(--dim);border-color:var(--line)}
/* Candidate and Hypothesis never borrow the verified treatment (004B §4). */
.p-cand{background:#1a1f2e;color:#9db4d8;border-color:#33405a;border-style:dashed}
.p-hyp{background:#1d1a2e;color:#b9a8e0;border-color:#413a63;border-style:dashed}
.muted{color:var(--dim)}
.five{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;margin:0}
.five dt{color:var(--dim)}.five dd{margin:0}
.note{background:#18202e;border:1px solid #2b3950;border-left:3px solid var(--accent);
  border-radius:7px;padding:9px 12px;font-size:12.5px;color:#c4d2ea;margin:8px 0}
.note.bad{background:#2a1618;border-color:#5e2a2e;border-left-color:var(--stop);color:#f0c3c3}
.note.warn{background:#2a2210;border-color:#5e4a1e;border-left-color:var(--warn);color:#efdcb4}
.chain{display:flex;flex-wrap:wrap;gap:5px}
.node{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:11.5px;
  background:var(--panel2);color:var(--dim)}
.node.done{border-color:#1d5c43;color:var(--ok)}
.node.cur{border-color:#2f5ca8;background:#1d3a6b;color:#fff;font-weight:600}
.srcs{display:grid;gap:5px;margin-top:5px}
.src{background:#1e222b;border:1px solid var(--line);border-left:3px solid var(--stop);
  border-radius:6px;padding:6px 9px;font-size:11.5px}
.tl{max-height:400px;overflow:auto;font-size:12px}
.ev{border-left:2px solid var(--line);padding:6px 0 6px 11px;margin-left:4px}
.ev.refused{border-left-color:var(--stop)}
.bridge{display:grid;gap:5px}
.stp{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:12px}
.stp.blocked{border-color:#5e2a2e;background:#221619}
#foot{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;flex-wrap:wrap;
  align-items:center;padding:10px 20px calc(10px + var(--safe));
  background:#0f1622;border-top:1px solid var(--line)}
#foot .grow{flex:1;min-width:120px;color:var(--dim);font-size:12px}
@media(max-width:720px){header,nav,main{padding-left:16px;padding-right:16px}
  #foot{padding-left:16px;padding-right:16px}h1{font-size:16px}}
</style>
</head>
<body>
<div id="banner">SYNTHETIC REPLAY / WORKING PROJECTION — 不是团队事实，不升级 TEAM_FACT；PR / Merge / Deploy / Production / Scale = NOT AUTHORIZED</div>
<header>
  <h1>HEMA Pre-Wired Runtime Harness <span class="muted" style="font-size:12px">v0.1 · 预通电运行台</span></h1>
  <div class="sub" id="meta"></div>
</header>
<nav id="nav"></nav>
<main>
  <section id="s-p1"></section><section id="s-p2"></section><section id="s-p3"></section>
  <section id="s-p4"></section><section id="s-p5"></section><section id="s-p6"></section>
  <section id="s-p7"></section><section id="s-p8"></section>
</main>

  <button id="btn-all">⏩ Run all 批量</button>
  <span class="grow" id="foot-status"></span>
</div>

<script>/* Pre-Wired Runtime Harness — view layer.
 *
 * Replays the recording the Python engine produced. `CURSOR` is how far through
 * the recorded timeline we are; every page renders from frames[0..CURSOR]. Step,
 * batch and reset move the cursor. Nothing here recomputes a state, a gate or a
 * finance figure — 004A §8 forbids a second set of business facts, and a second
 * implementation is how that starts.
 */
"use strict";
(() => {
  const D = JSON.parse(document.getElementById("harness-data").textContent);
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const OK = ["ACCEPTED", "VERIFIED", "READY", "CLOSED", "OBSERVED", "PASS", "DONE"];
  const WARN = ["EVIDENCE_PENDING", "PENDING", "PENDING_APPROVAL", "PARTIAL/OPEN",
                "NOT_READY", "OPEN", "WIP"];
  const STOP = ["CONFLICT", "REJECTED_INTAKE", "BLOCKED", "LOCKED", "NOT_AUTHORIZED",
                "CONFLICT/OPEN", "FAIL"];
  const HOLD = ["UNKNOWN", "DUPLICATE_NOOP", "NOT SELECTED", "NOT_TESTED", "TODO"];
  function kind(v) {
    v = String(v || "").toUpperCase();
    if (v === "CANDIDATE" || v === "SYNTHETIC") return "cand";
    if (v === "HYPOTHESIS") return "hyp";
    if (OK.includes(v)) return "ok";
    if (WARN.includes(v)) return "warn";
    if (STOP.includes(v)) return "stop";
    if (HOLD.includes(v)) return "hold";
    return "dim";
  }
  /* UNKNOWN renders as a dash. Never 0 (004B §4 / F01). */
  const dash = '<span class="muted">—</span>';
  const pill = (v, k) => (v == null || v === "") ? dash
    : `<span class="pill p-${k || kind(v)}">${esc(v)}</span>`;
  const num = v => (v == null) ? dash : esc(v);
  const panel = (t, b) => `<div class="panel"><h2>${esc(t)}</h2><div class="body">${b}</div></div>`;
  /* The five questions every page must answer (004B §4). */
  const five = o => `<dl class="five">
    <dt>Current State</dt><dd>${o.state ? pill(o.state) : dash}</dd>
    <dt>Blocking Reason</dt><dd>${esc(o.blocking) || dash}</dd>
    <dt>Missing Evidence</dt><dd>${(o.missing || []).length
      ? "<ul style='margin:0;padding-left:16px'>" + o.missing.map(m => `<li>${esc(m)}</li>`).join("") + "</ul>"
      : '<span class="muted">none outstanding</span>'}</dd>
    <dt>Owner</dt><dd>${esc(o.owner) || dash}</dd>
    <dt>Next Allowed Transition</dt><dd>${(o.next || []).length
      ? o.next.map(n => pill(n, "dim")).join(" ")
      : '<span class="muted">none — awaiting an authorised gate</span>'}</dd></dl>`;

  const TABS = [["p1", "P1 INBOX"], ["p2", "P2 6 BLOCKERS"], ["p3", "P3 FIRST LIVE TX"],
                ["p4", "P4 MACRO"], ["p5", "P5 REAL-15"], ["p6", "P6 HERO EVIDENCE"],
                ["p7", "P7 FINANCE"], ["p8", "P8 GATES / AUDIT"]];
  let CUR = "p1";
  let CURSOR = 0;                      // frames processed so far

  const seen = () => D.frames.slice(0, CURSOR);
  const latest = () => CURSOR ? D.frames[CURSOR - 1] : null;

  /* ---- P1 INBOX --------------------------------------------------------- */
  function p1() {
    const rows = seen();
    const counts = {};
    rows.forEach(f => { const r = f.step.Intake.result; counts[r] = (counts[r] || 0) + 1; });
    const order = ["ACCEPTED", "EVIDENCE_PENDING", "CONFLICT", "REJECTED_INTAKE",
                   "DUPLICATE_NOOP"];
    $("s-p1").innerHTML = panel("INBOX — intake outcomes",
      `<table><thead><tr><th>Intake result</th><th>Count</th><th>Meaning</th></tr></thead><tbody>`
      + order.map(r => `<tr><td>${pill(r)}</td><td>${counts[r] || 0}</td>
          <td class="muted">${esc({
            ACCEPTED: "validated, matched and evidenced",
            EVIDENCE_PENDING: "source present, claim not verified",
            CONFLICT: "sources disagree; neither is chosen",
            REJECTED_INTAKE: "refused; no object is created",
            DUPLICATE_NOOP: "idempotent repeat; no second task"}[r])}</td></tr>`).join("")
      + `</tbody></table>`)
      + panel("Events so far",
        `<table><thead><tr><th>Event</th><th>Type</th><th>Object</th><th>Intake</th>
          <th>Scenario</th><th>Reason</th></tr></thead><tbody>`
        + rows.map(f => `<tr><td><code>${esc(f.step.Event_ID)}</code></td>
            <td class="muted">${esc(f.step.Event_Type)}</td>
            <td><code>${esc(f.step.Object_ID)}</code></td>
            <td>${pill(f.step.Intake.result)}</td>
            <td class="muted">${esc(f.step.Scenario)}</td>
            <td class="muted">${esc(f.step.Intake.reason)}</td></tr>`).join("")
        + `</tbody></table>`
        + (rows.length ? "" : `<div class="note">No event has been replayed yet. Press <b>Step</b>.</div>`))
      + panel("State", five({
          state: rows.length ? "PROCESSING" : "IDLE",
          blocking: rows.length ? "" : "no event has been replayed yet",
          missing: [], owner: "Tech A / Claude Code",
          next: ["replay the next synthetic event"]}));
  }

  /* ---- P2 6 BLOCKERS ---------------------------------------------------- */
  function p2() {
    const b = D.blockers;
    const ids = Object.keys(b).filter(k => !k.startsWith("_"));
    $("s-p2").innerHTML = panel("6 BLOCKERS — working projection only",
      `<table><thead><tr><th>ID</th><th>Title</th><th>Object</th><th>Status</th>
        <th>Detail</th></tr></thead><tbody>`
      + ids.map(id => `<tr><td><code>${esc(id)}</code></td><td>${esc(b[id].title)}</td>
          <td class="muted">${esc(b[id].object)}</td><td>${pill(b[id].status)}</td>
          <td class="muted">${esc(b[id].detail || b[id].note || "")}
            ${b[id].fact_class ? " " + pill(b[id].fact_class) : ""}</td></tr>`).join("")
      + `</tbody></table>
        <div class="note warn">这是 WORKING PROJECTION，不是团队事实。任何一条都不会因为本页显示而升级为 TEAM_FACT。
          <span class="muted">A working projection, never a team fact.</span></div>`)
      + panel("State", five({state: "OPEN", blocking: "six blockers are open",
          missing: ids.map(i => `${i} ${b[i].title}`), owner: "HEMA Business A",
          next: ["close B04 verification conflict", "select the First Live TX"]}));
  }

  /* ---- P3 FIRST LIVE TX ------------------------------------------------- */
  function p3() {
    const sm = D.state_machine.states;
    const keys = Object.keys(sm);
    const f = latest();
    const cur = f ? f.state : D.state_machine.initial;
    const idx = keys.indexOf(cur);
    const refused = seen().filter(x => x.step.Transition_Refused);
    $("s-p3").innerHTML = panel(`FIRST LIVE TX — S0 … S14 (current: ${esc(cur)} ${esc(sm[cur].name)})`,
      `<div class="chain">` + keys.map((k, i) =>
        `<div class="node ${i < idx ? "done" : i === idx ? "cur" : ""}">
           <code>${esc(k)}</code> ${esc(sm[k].name)}</div>`).join("") + `</div>
       <div class="note">跳级一律拒绝并写 Audit。${refused.length
         ? `本次回放共拒绝 <b>${refused.length}</b> 次。`
         : "本次回放尚无跳级尝试。"}
         <span class="muted">A level skip is always refused and audited.</span></div>`
      + (refused.length ? `<table><thead><tr><th>Event</th><th>Refused</th></tr></thead><tbody>`
         + refused.map(x => `<tr><td><code>${esc(x.step.Event_ID)}</code></td>
             <td class="muted">${esc(x.step.Transition_Refused)}</td></tr>`).join("")
         + `</tbody></table>` : ""))
      + panel("Before → After (this step)", f
        ? `<table><tbody>
             <tr><th>Event</th><td><code>${esc(f.step.Event_ID)}</code> ${esc(f.step.Event_Type)}</td></tr>
             <tr><th>Intake</th><td>${pill(f.step.Intake.result)} <span class="muted">${esc(f.step.Intake.reason)}</span></td></tr>
             <tr><th>Before</th><td><code>${esc(f.step.Before_State)}</code></td></tr>
             <tr><th>After</th><td><code>${esc(f.step.After_State)}</code></td></tr>
             <tr><th>Gate</th><td>${f.step.Gate ? pill(f.step.Gate.verdict) + " " + esc(f.step.Gate.gate)
                 + (f.step.Gate.missing_evidence.length
                    ? ` <span class="muted">missing: ${esc(f.step.Gate.missing_evidence.join(", "))}</span>` : "")
                 + (f.step.Gate.note ? ` <span class="muted">(${esc(f.step.Gate.note)})</span>` : "")
                 : dash}</td></tr>
           </tbody></table>`
        : `<div class="note">Press <b>Step</b> to replay the first event.</div>`)
      + panel("State", five({state: `${cur} ${sm[cur].name}`,
          blocking: D.projection.Blocking_Reason,
          missing: D.projection.Missing_Evidence,
          owner: D.projection.Owner_Role,
          next: f ? f.next : [keys[1] + " " + sm[keys[1]].name]}));
  }

  /* ---- P4 MACRO --------------------------------------------------------- */
  function p4() {
    const m = D.macro;
    $("s-p4").innerHTML = panel(`MACRO — ${num(m.value)} revalidation`,
      `<table><thead><tr><th>Input slot</th><th>State</th><th>Evidence_ID</th></tr></thead><tbody>`
      + Object.entries(m.slots).map(([s, v]) => `<tr><td>${esc(s)}</td>
          <td>${pill(v.state)}</td><td class="muted">${v.evidence_id ? "<code>" + esc(v.evidence_id) + "</code>" : dash}</td></tr>`).join("")
      + `</tbody></table>
        <div class="note">${esc(m.completeness.verified)} / ${esc(m.completeness.total)} 输入已核验。
          KEEP / ADJUST / REJECT = ${esc(m.decision.decision)} — ${esc(m.decision.reason)}</div>`)
      + panel("A / B / C Readiness",
        `<div class="note ${m.abc.status === "NOT_READY" ? "bad" : ""}">Macro Gate ${pill(m.gate.verdict)}
           ${m.gate.missing_evidence.length ? `<span class="muted">missing: ${esc(m.gate.missing_evidence.join(", "))}</span>` : ""}
           <div class="muted" style="margin-top:4px">${esc(m.abc.reason)}</div></div>`
        + (m.abc.packs.length
           ? `<table><thead><tr><th>Case</th><th>State</th><th>Approved</th></tr></thead><tbody>`
             + m.abc.packs.map(p => `<tr><td><code>${esc(p.case)}</code></td>
                 <td>${pill(p.state)}</td><td>${pill(String(p.approved).toUpperCase() === "TRUE" ? "YES" : "NO", "stop")}</td></tr>`).join("")
             + `</tbody></table>`
           : `<div class="note">Macro Gate 未满足，不生成 A/B/C Decision Pack。</div>`))
      + panel("State", five({state: m.decision.fact_class,
          blocking: m.decision.reason, missing: m.completeness.unknown.map(s => "Macro:" + s),
          owner: "A4 DecisionRight", next: ["close the macro input evidence"]}));
  }

  /* ---- P5 REAL-15 ------------------------------------------------------- */
  function p5() {
    const b04 = D.blockers.B04;
    $("s-p5").innerHTML = panel("REAL-15 — read-only current routing / state",
      `<div class="note warn">REAL-15 在本 Harness 中<strong>只读</strong>。004 §9 要求本页不重建十五颗；
         装载第一颗 TX 不触碰它们。<span class="muted">Read-only here; loading the first TX does not rebuild the fifteen.</span></div>
       <table><thead><tr><th>Object</th><th>Status</th><th>Detail</th></tr></thead><tbody>
         <tr><td><code>${esc(b04.object)}</code></td><td>${pill(b04.status)}</td>
             <td class="muted">${esc(b04.detail)}</td></tr>
       </tbody></table>`
      + `<div class="note bad">V 定义冲突未关闭：<code>0/7</code> 与 <code>8/8</code> 并列，不自动择一。
           关闭后才可更新 Current V。</div>`)
      + panel("Routing_Class 规则", `<table><thead><tr><th>Value</th><th>Meaning</th></tr></thead><tbody>`
        + D.routing.values.map(v => `<tr><td>${pill(v)}</td>
            <td class="muted">${esc(D.routing[v])}</td></tr>`).join("")
        + `</tbody></table><div class="note">${esc(D.routing.growth_lever_rule)}</div>`)
      + panel("State", five({state: "CONFLICT", blocking: b04.detail,
          missing: ["REAL-15 verification basis agreement"], owner: "HEMA Business A",
          next: ["raise EVIDENCE_CONFLICT_DETECTED and close it"]}));
  }

  /* ---- P6 HERO EVIDENCE ------------------------------------------------- */
  function p6() {
    const items = D.evidence;
    $("s-p6").innerHTML = panel("HERO EVIDENCE — mapping",
      `<table><thead><tr><th>Observation</th><th>Object</th><th>Window</th><th>Source</th>
        <th>Role</th><th>Fact_Class</th><th>Attaches to</th><th>Missing</th></tr></thead><tbody>`
      + items.map(i => `<tr><td>${esc(i.Observation)}</td>
          <td>${i.Object_ID ? "<code>" + esc(i.Object_ID) + "</code>" : dash}</td>
          <td class="muted">${esc(i.Time_Window) || dash}</td>
          <td class="muted">${esc(i.Source) || dash}</td>
          <td>${pill(i.Role)}</td><td>${pill(i.Fact_Class)}</td>
          <td class="muted">${i.Attaches_To ? "<code>" + esc(i.Attaches_To) + "</code>" : dash}</td>
          <td class="muted">${esc((i.Missing_Evidence || []).join(", ")) || dash}</td></tr>`).join("")
      + `</tbody></table>
        <div class="note warn">会议共识、品牌回复、销售回复、访谈都是 Evidence Input，
          <strong>不自动等于 TEAM_FACT 或 Verified Root Cause</strong>。
          对象 / 时间 / 来源无法确定的，保持 HYPOTHESIS 或 UNKNOWN。</div>`)
      + panel("State", five({state: "CANDIDATE",
          blocking: "no mapped item has an independent verifier",
          missing: items.filter(i => (i.Missing_Evidence || []).length)
                        .map(i => `${i.Evidence_ID || "unidentified"}: ${(i.Missing_Evidence || []).join(", ")}`),
          owner: "A-line Macro RGM / B-line TX", next: ["obtain an independent V"]}));
  }

  /* ---- P7 FINANCE ------------------------------------------------------- */
  function p7() {
    const f = D.finance;
    $("s-p7").innerHTML = panel("FINANCE — gross → six leakages → net → CM → ROI",
      `<div class="bridge">` + f.steps.map(s => `<div class="stp${s.status === "BLOCKED" ? " blocked" : ""}">
          <span><b>${esc(s.step)}</b> — ${num(s.value)}
            ${s.reason || s.note ? `<div class="muted">${esc(s.reason || s.note)}</div>` : ""}</span>
          ${pill(s.status)}</div>`).join("") + `</div>
       <div class="note bad">Blocked at <b>${esc(f.blocked_at)}</b>. 任一适用 Leakage = UNKNOWN →
         Verified Net Increment = BLOCKED；<strong>UNKNOWN 绝不按 0 处理</strong>。</div>
       <div class="note">${esc(f.gross_is_not_net)}</div>`)
      + panel("三类增量分别输出，不得混写", `<table><thead><tr><th>Increment</th><th>Value</th><th>Status</th></tr></thead><tbody>`
        + Object.entries(f.increments).map(([k, v]) => `<tr><td><code>${esc(k)}</code></td>
            <td>${num(v.value)}</td><td>${pill(v.status)}</td></tr>`).join("")
        + `</tbody></table>`)
      + panel("State", five({state: "BLOCKED", blocking: f.net_increment.reason,
          missing: f.unknown_leakages, owner: "Finance + Independent V",
          next: ["close the six leakage evidences", "obtain a finance V"]}));
  }

  /* ---- P8 GATES / AUDIT ------------------------------------------------- */
  function p8() {
    const rows = seen();
    $("s-p8").innerHTML = panel("GATE verdicts (this replay)",
      rows.filter(f => f.step.Gate).length
      ? `<table><thead><tr><th>Event</th><th>Gate</th><th>Verdict</th><th>Missing</th><th>Note</th></tr></thead><tbody>`
        + rows.filter(f => f.step.Gate).map(f => `<tr><td><code>${esc(f.step.Event_ID)}</code></td>
            <td>${esc(f.step.Gate.gate)}</td><td>${pill(f.step.Gate.verdict)}</td>
            <td class="muted">${esc(f.step.Gate.missing_evidence.join(", ")) || dash}</td>
            <td class="muted">${esc(f.step.Gate.note || f.step.Gate.reason)}</td></tr>`).join("")
        + `</tbody></table><div class="note">任何 READY ≠ APPROVED。系统不得自行宣布 Gate 通过。
             <span class="muted">READY is never APPROVED; the engine has no approve path.</span></div>`
      : `<div class="note">No gate has been evaluated yet.</div>`)
      + panel("Gate rules (frozen)", `<table><thead><tr><th>Gate</th><th>Requires</th><th>Yields</th></tr></thead><tbody>`
        + Object.entries(D.gates).map(([g, s]) => `<tr><td><code>${esc(g)}</code></td>
            <td class="muted">${esc((s.requires || []).join(" · "))}</td>
            <td class="muted">${esc(s.yields)}</td></tr>`).join("")
        + `</tbody></table>`)
      + panel(`AUDIT — before → after (${rows.length} step${rows.length === 1 ? "" : "s"})`,
        `<div class="tl">` + rows.slice().reverse().map(f => `
          <div class="ev ${f.step.Transition_Refused ? "refused" : ""}">
            <div class="muted">${esc(f.step.Timestamp)} · rule ${esc(f.step.Rule_Version)}</div>
            <div><strong>${esc(f.step.Event_Type)}</strong> <code>${esc(f.step.Event_ID)}</code>
              ${pill(f.step.Intake.result)}
              ${f.step.Transition_Refused ? pill("REFUSED", "stop") : ""}</div>
            <div class="muted"><code>${esc(f.step.Before_State)}</code> → <code>${esc(f.step.After_State)}</code></div>
            ${f.step.Transition_Refused ? `<div class="muted">${esc(f.step.Transition_Refused)}</div>` : ""}
          </div>`).join("") + `</div>`)
      + panel("State", five({state: "AUDITED",
          blocking: "no gate has been approved; approval is a human decision",
          missing: [], owner: "Chief Architect / Gate Approver",
          next: ["PW-3 Replay Verification"]}));
  }

  function render() {
    $("meta").innerHTML = `contract <code>${esc(D.contract.id)}</code> · ${pill(D.contract.status)}`
      + ` · rules <code>${esc(D.contract.rule_version)}</code>`
      + ` · baseline <code>${esc(D.baseline.sha256.slice(0, 12))}…</code> ${pill("READ ONLY", "stop")}`;
    $("nav").innerHTML = TABS.map(([id, label]) =>
      `<button data-tab="${id}" class="${id === CUR ? "on" : ""}">${esc(label)}</button>`).join("");
    p1(); p2(); p3(); p4(); p5(); p6(); p7(); p8();
    TABS.forEach(([id]) => $("s-" + id).classList.toggle("on", id === CUR));
    $("btn-step").disabled = CURSOR >= D.frames.length;
    $("btn-all").disabled = CURSOR >= D.frames.length;
    const f = latest();
    $("foot-status").innerHTML = `${CURSOR} / ${D.frames.length} events replayed`
      + (f ? ` · state <code>${esc(f.state)} ${esc(f.state_name)}</code>` : "")
      + ` · <span class="muted">SYNTHETIC</span>`;
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.tab) { CUR = t.dataset.tab; render(); return; }
    if (t.id === "btn-step" && CURSOR < D.frames.length) { CURSOR += 1; render(); return; }
    if (t.id === "btn-all") { CURSOR = D.frames.length; render(); return; }
    if (t.id === "btn-reset") { CURSOR = 0; render(); return; }
  });

  render();
  window.__harness = { get cursor() { return CURSOR; },
                       set cursor(n) { CURSOR = Math.max(0, Math.min(n, D.frames.length)); render(); },
                       data: D, frames: D.frames.length,
                       tab(id) { CUR = id; render(); } };
})();
</script>
</body>
</html>
