@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#banner{position:sticky;top:0;z-index:50;padding:10px 20px;text-align:center;font-weight:700;
  letter-spacing:.05em;font-size:12.5px;border-bottom:2px solid var(--syn);color:var(--syn);

header{padding:14px 20px 0}
h1{font-size:17px;margin:0}
.sub{color:var(--dim);font-size:12px;margin-top:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;align-items:center}
select,button{font-family:inherit;font-size:13px;min-height:var(--tap);
  background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;
  padding:0 14px;cursor:pointer}
button.primary{background:#1d3a6b;border-color:#2f5ca8}
button:disabled{opacity:.45;cursor:not-allowed}
nav{display:flex;gap:6px;padding:6px 20px 12px;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{min-height:var(--tap);color:var(--dim);white-space:nowrap}
nav button.on{background:#1d3a6b;border-color:#2f5ca8;color:#fff}
main{padding:16px 20px calc(96px + var(--safe));display:grid;gap:16px}
section{display:none}section.on{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.panel>h2{margin:0;padding:11px 14px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid var(--line);background:var(--panel2)}
.panel .body{padding:13px 14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
code{font-family:var(--mono);font-size:11.5px;color:#c4d2ea}
/* Locked rule 4: one pill per dimension, never a merged one. */
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid transparent;white-space:nowrap}
.p-ok{background:#0f2e21;color:var(--ok);border-color:#1d5c43}
.p-warn{background:#33270c;color:var(--warn);border-color:#6b5318}
.p-stop{background:#331416;color:var(--stop);border-color:#6b2a2e}
.p-hold{background:#241c3d;color:var(--hold);border-color:#443a72}
.p-dim{background:#1e222b;color:var(--dim);border-color:var(--line)}
.p-cand{background:#1a1f2e;color:#9db4d8;border-color:#33405a;border-style:dashed}
.muted{color:var(--dim)}
.note{background:#1a2030;border:1px solid #2c3a57;border-left:3px solid var(--accent);
  border-radius:7px;padding:9px 12px;font-size:12.5px;color:#c4d2ea;margin:8px 0}
.note.bad{background:#2a1618;border-color:#5e2a2e;border-left-color:var(--stop);color:#f0c3c3}
.note.warn{background:#2a2210;border-color:#5e4a1e;border-left-color:var(--warn);color:#efdcb4}
.dims{display:flex;gap:5px;flex-wrap:wrap}
.tl{max-height:420px;overflow:auto;font-size:12px}
.ev{border-left:2px solid var(--line);padding:6px 0 6px 11px;margin-left:4px}
.ev.refused{border-left-color:var(--stop)}
.zh{display:block;color:#a8bde0;font-weight:400}
/* Bottom-anchored bar: the control that A19 is really about. */
#foot{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;flex-wrap:wrap;
  align-items:center;padding:10px 20px calc(10px + var(--safe));
  background:#101724;border-top:1px solid var(--line)}
#foot .grow{flex:1;min-width:0;color:var(--dim);font-size:12px}
@media(max-width:720px){
  header,.bar,nav,main{padding-left:16px;padding-right:16px}
  h1{font-size:16px}
  #foot{padding-left:16px;padding-right:16px}
}
</style>

<script>/* Build Review Console — core (INF-DEV-CONSOLE-001A, DAC-1 frozen contract).
 *
 * A01 requires this file to carry no product vocabulary. It therefore knows only
 * the contract's own words: Requirement, Inheritance, Evidence_Binding, Gate and
 * so on. Everything a product is — its identifiers, its objects, its wording —
 * arrives as configuration. Two products with no shared field name and no shared
 * value both load through this one core; that is the test, and it is the reason
 * the core can be trusted not to have been written around one of them.
 *
 * The contract is read, never restated. Enum members, required fields and the
 * role matrix come from the embedded freeze, so this file cannot drift from the
 * document that approved it.
 */
"use strict";

const Core = (() => {
  let FREEZE = null, PACK = null;

  /* ---- contract accessors ------------------------------------------------ */
  function init(freeze, pack) { FREEZE = freeze; PACK = pack; }
  function dim(name) { return FREEZE.dimensions[name].values.slice(); }
  function roles() { return FREEZE.permissions.roles.slice(); }
  function lockedRules() { return FREEZE.locked_rules.slice(); }
  function cases() { return PACK.cases.slice(); }

  /* ---- permissions ------------------------------------------------------- */
  const ACTIONS = {
    SET_VERIFICATION_PASS: "置 Verification_Result = PASS",
    SET_GATE_APPROVED_RETURNED: "置 Gate = APPROVED / RETURNED",
    SET_GATE_READY: "置 Gate = READY_FOR_REVIEW",
    RULE_EVENT_CONFLICT: "裁决 Event CONFLICT",
    SET_EVENT_DECISION: "置 Event_Decision = REUSE / NEW",
    CREATE_EVIDENCE_BINDING: "创建 Evidence_Binding",
    REGISTER_SCHEMA_DELTA: "登记 Schema_Delta / CONFLICT",
    WRITE_RUNTIME_BUSINESS_STATE: "写 Runtime 经营状态",
    PR_MERGE_DEPLOY_SCALE: "PR / Merge / Deploy / Scale",
  };
  function decide(role, actionId) {
    const text = ACTIONS[actionId];
    const row = FREEZE.permissions.matrix.find(r => r.action === text);
    if (!row) throw new Error("unknown action " + actionId);
    if (!row.hasOwnProperty(role)) throw new Error("unknown role " + role);
    return row[role];
  }
  /* ALLOW only. N_A is refused as firmly as FORBID: an action that is not this
     role's to take is not made permissible by the absence of a prohibition. */
  function may(role, actionId) { return decide(role, actionId) === "ALLOW"; }

  /* ---- the four bindings a PASS needs (D6 / locked rule 1) --------------- */
  const BINDING_KEYS = ["Evidence_ID", "Test_Run_ID", "Commit_SHA", "Verifier_ID"];
  function missingBindings(binding) {
    if (!binding) return BINDING_KEYS.slice();
    return BINDING_KEYS.filter(k => !binding[k]);
  }

  /* ---- state ------------------------------------------------------------- */
  function newId(prefix) {
    const rnd = (crypto && crypto.randomUUID) ? crypto.randomUUID()
              : String(Date.now()) + Math.random().toString(16).slice(2);
    return prefix ? prefix + "-" + rnd : rnd;
  }

  function createSession(config, reviewer) {
    const baselineSha = (config.baseline || {}).Baseline_SHA || null;
    return {
      Review_ID: newId(),                       // frozen at creation (G3)
      Project_ID: config.Project_ID,
      Product_ID: config.Product_ID,
      Version_ID: config.Version_ID,
      Taskbook_ID: config.Taskbook_ID,
      Secondary_Taskbook_ID: config.Secondary_Taskbook_ID || null,
      Baseline_SHA: baselineSha,
      Baseline_State: baselineSha ? "VERIFIED" : "UNKNOWN",
      Schema_Version: config.schema_version,
      Config_Version: config.config_version,
      Test_Pack_ID: config.test_pack_id,
      Reviewer_ID: reviewer.id,
      Reviewer_Role: reviewer.role,
      Started_At: new Date().toISOString(),
      Updated_At: new Date().toISOString(),
      Status: "OPEN",
      requirements: (config.requirements || []).map(r => Object.assign({}, r, {
        Verification_Result: "NOT_TESTED", Evidence_ID: null })),
      inheritance: (config.inheritance || []).map(i => Object.assign({}, i, {
        // Locked rule 2: with no session baseline, a regression cannot pass.
        Verification_Result: baselineSha ? (i.Verification_Result || "PENDING") : "PENDING",
        Baseline_Locked: !baselineSha })),
      events: (config.candidate_events || []).map(e => Object.assign({}, e)),
      schema_deltas: (config.schema_deltas || []).map(s => Object.assign({}, s)),
      deliverables: (config.deliverables || []).map(d => Object.assign({}, d)),
      gates: (config.gates || []).map(g => Object.assign({}, g)),
      bindings: [],
      audit: [],
    };
  }

  /* ---- audit (A15) ------------------------------------------------------- */
  function audit(session, entry) {
    session.audit.push({
      Audit_ID: newId("AUD"),
      Object_ID: entry.objectId, Object_Type: entry.objectType,
      Before: entry.before === undefined ? null : entry.before,
      After: entry.after === undefined ? null : entry.after,
      Actor_ID: entry.actorId, Actor_Role: entry.actorRole,
      Evidence_ID: entry.evidenceId || null,
      Rule_Version: FREEZE.rule_version,
      Timestamp: new Date().toISOString(),
      Refused: !!entry.refused,
      Reason: entry.reason || null,
    });
    session.Updated_At = new Date().toISOString();
  }

  /* ---- marking a verification (A03a / A03b / A10 / A16) ------------------ */
  function setVerification(session, kind, objectId, result, actor, binding) {
    const list = kind === "requirement" ? session.requirements : session.inheritance;
    const key = kind === "requirement" ? "Requirement_ID" : "Capability_ID";
    const target = list.find(o => o[key] === objectId);
    if (!target) return { ok: false, reason: "no such object" };
    const before = { Verification_Result: target.Verification_Result,
                     Evidence_ID: target.Evidence_ID || null };

    const refuse = (reason, extra) => {
      audit(session, { objectId, objectType: kind, before, after: before,
                       actorId: actor.id, actorRole: actor.role,
                       refused: true, reason });
      return Object.assign({ ok: false, reason }, extra || {});
    };

    if (result === "PASS") {
      if (!may(actor.role, "SET_VERIFICATION_PASS")) {
        return refuse("role " + actor.role + " may not set PASS: matrix says "
                      + decide(actor.role, "SET_VERIFICATION_PASS"));
      }
      const missing = missingBindings(binding);
      if (missing.length) {
        return refuse("no verified pass without evidence", { missing: missing });
      }
      if (kind === "inheritance" && !session.Baseline_SHA) {
        return refuse("Baseline_SHA is absent, so a regression may not pass");
      }
    }
    if (kind === "inheritance" && !session.Baseline_SHA
        && !["PENDING", "UNKNOWN", "NOT_TESTED"].includes(result)) {
      return refuse("Baseline_SHA is absent: regression is limited to PENDING / UNKNOWN");
    }

    target.Verification_Result = result;
    target.Evidence_ID = (result === "PASS" && binding) ? binding.Evidence_ID : null;
    // A software result never moves a business fact class (locked rule 5).
    audit(session, { objectId, objectType: kind, before,
                     after: { Verification_Result: target.Verification_Result,
                              Evidence_ID: target.Evidence_ID },
                     actorId: actor.id, actorRole: actor.role,
                     evidenceId: target.Evidence_ID });
    return { ok: true };
  }

  function addBinding(session, binding, actor) {
    if (!may(actor.role, "CREATE_EVIDENCE_BINDING")) {
      return { ok: false, reason: "role " + actor.role + " may not create a binding" };
    }
    session.bindings.push(binding);
    audit(session, { objectId: binding.Evidence_ID, objectType: "Evidence_Binding",
                     before: null, after: binding,
                     actorId: actor.id, actorRole: actor.role,
                     evidenceId: binding.Evidence_ID });
    return { ok: true };
  }

  /* ---- events (A06) ------------------------------------------------------ */
  function eventState(ev) {
    // A conflict with no architect decision stays pending; it is never resolved
    // by the console picking one.
    if (ev.Decision === "CONFLICT" && !ev.Architect_Decision_ID) return "PENDING";
    return ev.Decision || "PENDING";
  }

  /* ---- schema delta (A17) ------------------------------------------------ */
  function schemaVersionState(session) {
    if (session.Schema_Version !== FREEZE.schema_version) return "CONFLICT";
    return "MATCH";
  }
  function deltaState(sd) {
    if (sd.Classification === "CONFLICT" && !sd.Architect_Decision_ID) return "PENDING";
    return sd.Classification;
  }

  /* ---- gates (A08 / A10) ------------------------------------------------- */
  function criticalFailures(session) {
    return session.requirements.filter(
      r => r.Criticality === "CRITICAL" && r.Verification_Result === "FAIL");
  }
  function canAcceptDevelopment(session) {
    return criticalFailures(session).length === 0;
  }
  function setGate(session, gateId, status, actor) {
    const gate = session.gates.find(g => g.Gate_ID === gateId);
    if (!gate) return { ok: false, reason: "no such gate" };
    const action = (status === "APPROVED" || status === "RETURNED")
      ? "SET_GATE_APPROVED_RETURNED" : "SET_GATE_READY";
    const before = { Gate_Status: gate.Gate_Status };
    if (!may(actor.role, action)) {
      audit(session, { objectId: gateId, objectType: "Gate", before, after: before,
                       actorId: actor.id, actorRole: actor.role, refused: true,
                       reason: "role " + actor.role + " may not set " + status });
      return { ok: false, reason: "role " + actor.role + " may not set " + status };
    }
    if (status === "APPROVED" && !canAcceptDevelopment(session)) {
      audit(session, { objectId: gateId, objectType: "Gate", before, after: before,
                       actorId: actor.id, actorRole: actor.role, refused: true,
                       reason: "a CRITICAL item is failing" });
      return { ok: false, reason: "a CRITICAL item is failing" };
    }
    gate.Gate_Status = status;
    gate.Decision_ID = "DEC-" + newId();
    gate.Decision_Time = new Date().toISOString();
    audit(session, { objectId: gateId, objectType: "Gate", before,
                     after: { Gate_Status: status },
                     actorId: actor.id, actorRole: actor.role });
    // Accepting development has no downstream effect. There is no code path from
    // here to a pull request, a merge, a deploy or a scale-up (A11).
    return { ok: true };
  }

  /* ---- filters (A07 / A09) ---------------------------------------------- */
  function blockers(session) {
    return session.requirements.filter(
      r => r.Implementation_State === "BLOCKED"
        || (r.Criticality === "CRITICAL" && r.Verification_Result === "FAIL"));
  }
  function decisionRequired(session) {
    const out = [];
    session.events.forEach(e => {
      if (e.Decision === "CONFLICT" && !e.Architect_Decision_ID)
        out.push({ type: "Event_Review", id: e.Candidate_Event });
    });
    session.schema_deltas.forEach(s => {
      if (s.Classification === "CONFLICT" && !s.Architect_Decision_ID)
        out.push({ type: "Schema_Delta", id: s.Schema_Item_ID });
    });
    return out;
  }

  /* ---- export / import (A02 / A14) -------------------------------------- */
  function exportReview(session) {
    return JSON.parse(JSON.stringify({
      _format: "CONSOLE-001A/REVIEW/v0.1",
      Schema_Version: session.Schema_Version,
      Rule_Version: FREEZE.rule_version,
      Test_Pack_ID: session.Test_Pack_ID,
      session: session,
    }));
  }
  function importReview(payload) {
    const s = payload && payload.session;
    if (!s || !s.Review_ID) throw new Error("not a review export");
    return JSON.parse(JSON.stringify(s));   // Review_ID carried over, never reissued
  }

  /* ---- handback (A14) ---------------------------------------------------- */
  function handback(session) {
    const gate = session.gates[0] || {};
    return {
      Review_ID: session.Review_ID,
      Version_ID: session.Version_ID,
      Gate_Status: gate.Gate_Status || "NOT_READY",
    };
  }
  function humanHandback(session) {
    const h = handback(session);
    return [
      "Review_ID: " + h.Review_ID,
      "Version_ID: " + h.Version_ID,
      "Gate_Status: " + h.Gate_Status,
    ].join("\n");
  }

  /* ---- export guard (A13 / locked rule 7) -------------------------------- */
  function mayExportAsTeamFact(config, object) {
    if (config.export_as_team_fact === false) return false;
    if ((object && object.Fact_Class) === "TEAM_FACT") return true;
    return false;
  }
  function exportAsTeamFact(config, object) {
    if (!mayExportAsTeamFact(config, object)) {
      return { ok: false,
               reason: "objects of synthetic origin cannot be exported as TEAM_FACT" };
    }
    return { ok: true };
  }

  return { init, dim, roles, lockedRules, cases, decide, may, missingBindings,
           createSession, audit, setVerification, addBinding, eventState,
           schemaVersionState, deltaState, criticalFailures, canAcceptDevelopment,
           setGate, blockers, decisionRequired, exportReview, importReview,
           handback, humanHandback, exportAsTeamFact, BINDING_KEYS };
})();

if (typeof module !== "undefined") { module.exports = Core; }
</script>
<script>/* Build Review Console — view layer.
 *
 * Renders what Core computes. Two rules shape the whole file: each of the five
 * dimensions gets its own cell and its own pill (locked rule 4, A04), and a
 * control the role may not use is not rendered at all rather than rendered
 * disabled (A10) — a disabled button still tells the reader the action is theirs
 * to take.
 */
"use strict";
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const FREEZE = JSON.parse($("freeze-data").textContent);
  const PACK = JSON.parse($("pack-data").textContent);
  const PRODUCTS = JSON.parse($("products-data").textContent);
  Core.init(FREEZE, PACK);

  const OK = ["PASS", "DONE", "APPROVED", "REUSE", "MATCH", "VERIFIED", "ACCEPTED"];
  const WARN = ["PENDING", "WIP", "READY_FOR_REVIEW", "NEW", "IN_REVIEW", "REVALIDATION"];
  const STOP = ["FAIL", "BLOCKED", "CONFLICT", "RETURNED", "NOT_AUTHORIZED", "FORBID"];
  const HOLD = ["UNKNOWN", "NOT_TESTED", "NOT_READY", "TODO", "N_A"];
  function kind(v) {
    v = String(v || "").toUpperCase();
    if (v === "CANDIDATE" || v === "HYPOTHESIS" || v === "SYNTHETIC") return "cand";
    if (OK.includes(v)) return "ok";
    if (WARN.includes(v)) return "warn";
    if (STOP.includes(v)) return "stop";
    if (HOLD.includes(v)) return "hold";
    return "dim";
  }
  /* Locked rule 3: UNKNOWN shows a dash, never 0. */
  const pill = (v, k) => (v == null || v === "")
    ? '<span class="muted">—</span>'
    : `<span class="pill p-${k || kind(v)}">${esc(v)}</span>`;
  const panel = (t, b) => `<div class="panel"><h2>${t}</h2><div class="body">${b}</div></div>`;

  let SESSION = null;
  let EXPORT_RESULT = null;   // survives the re-render that follows the click
  let ACTOR = { id: "claude-code", role: "DEV" };
  let PRODUCT = PRODUCTS[0];
  let CUR = "overview";

  const TABS = [["overview", "Overview 总览"], ["requirements", "Requirements 需求"],
                ["inheritance", "Inheritance 继承"], ["events", "Events 事件"],
                ["deliverables", "Deliverables 交付物"], ["gate", "Gate 闸口"],
                ["audit", "Audit 审计"], ["pack", "Test Pack 验收表"]];

  const LS_KEY = "console-001a-session";
  function cache() {
    // Convenience cache only. Never evidence, never the only record (D5).
    try { localStorage.setItem(LS_KEY, JSON.stringify(Core.exportReview(SESSION))); }
    catch (e) { /* private mode, blocked storage, preview: not an error */ }
  }
  function restore() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      return Core.importReview(JSON.parse(raw));
    } catch (e) { return null; }
  }

  function newSession() {
    EXPORT_RESULT = null;
    SESSION = Core.createSession(PRODUCT, ACTOR);
    Core.audit(SESSION, { objectId: SESSION.Review_ID, objectType: "Review_Session",
                          before: null, after: { Status: "OPEN" },
                          actorId: ACTOR.id, actorRole: ACTOR.role });
    cache(); render();
  }

  /* ---- rendering -------------------------------------------------------- */
  function dimsRow(o) {
    // Five cells, five pills. Never one combined status (A04).
    return `<td>${pill(o.Fact_Class)}</td><td>${pill(o.Implementation_State)}</td>`
         + `<td>${pill(o.Verification_Result)}</td>`;
  }

  function renderOverview() {
    const s = SESSION;
    const schema = Core.schemaVersionState(s);
    $("s-overview").innerHTML =
      panel("Review Session", `<table><tbody>
        <tr><th>Review_ID</th><td><code>${esc(s.Review_ID)}</code></td></tr>
        <tr><th>Project / Product</th><td><code>${esc(s.Project_ID)}</code> · <code>${esc(s.Product_ID)}</code></td></tr>
        <tr><th>Version</th><td><code>${esc(s.Version_ID)}</code></td></tr>
        <tr><th>Taskbook</th><td><code>${esc(s.Taskbook_ID)}</code>${s.Secondary_Taskbook_ID ? " · <code>" + esc(s.Secondary_Taskbook_ID) + "</code>" : ""}</td></tr>
        <tr><th>Baseline_SHA</th><td>${s.Baseline_SHA ? "<code>" + esc(s.Baseline_SHA.slice(0, 16)) + "…</code>" : '<span class="muted">—</span>'} ${pill(s.Baseline_State)}</td></tr>
        <tr><th>Schema_Version</th><td><code>${esc(s.Schema_Version)}</code> ${pill(schema)}</td></tr>
        <tr><th>Test_Pack_ID</th><td><code>${esc(s.Test_Pack_ID)}</code></td></tr>
        <tr><th>Reviewer</th><td>${esc(s.Reviewer_ID)} · ${pill(s.Reviewer_Role, "dim")}</td></tr>
        <tr><th>Status</th><td>${pill(s.Status)}</td></tr>
        </tbody></table>`
        + (s.Baseline_State === "UNKNOWN"
           ? `<div class="note bad">Baseline_SHA 缺失 → Baseline_State = UNKNOWN，所有 Regression 强制 PENDING，不得置 PASS。
              <span class="zh">No baseline sha: every regression is held at PENDING and cannot pass.</span></div>` : "")
        + (schema === "CONFLICT"
           ? `<div class="note bad">Schema_Version 与冻结合同不一致 → CONFLICT，不自动择一。
              <span class="zh">Schema version differs from the frozen contract; shown as conflict and not auto-resolved.</span></div>` : ""))
      + panel("Blockers (A07) · Decision required (A09)",
          `<table><thead><tr><th>Type</th><th>ID</th><th>Why</th></tr></thead><tbody>`
          + Core.blockers(SESSION).map(r => `<tr><td>Requirement</td><td><code>${esc(r.Requirement_ID)}</code></td>
              <td>${esc(r.Implementation_State === "BLOCKED" ? "BLOCKED" : "CRITICAL FAIL")}</td></tr>`).join("")
          + Core.decisionRequired(SESSION).map(d => `<tr><td>${esc(d.type)}</td><td><code>${esc(d.id)}</code></td>
              <td>awaiting an architect decision</td></tr>`).join("")
          + `</tbody></table>`);
  }

  function renderRequirements() {
    const canPass = Core.may(ACTOR.role, "SET_VERIFICATION_PASS");
    $("s-requirements").innerHTML = panel("Requirements",
      `<table><thead><tr><th>ID</th><th>Section</th><th>Criticality</th>
        <th>Fact_Class</th><th>Implementation_State</th><th>Verification_Result</th>
        <th>Evidence</th><th></th></tr></thead><tbody>`
      + SESSION.requirements.map(r => `<tr>
          <td><code>${esc(r.Requirement_ID)}</code></td>
          <td class="muted">${esc(r.Section_Ref)}</td>
          <td>${pill(r.Criticality, r.Criticality === "CRITICAL" ? "stop" : "dim")}</td>
          ${dimsRow(r)}
          <td class="muted">${r.Evidence_ID ? "<code>" + esc(r.Evidence_ID) + "</code>" : "—"}</td>
          <td>${canPass
              ? `<button data-pass="${esc(r.Requirement_ID)}">Mark PASS</button>`
              : `<span class="muted" title="matrix: ${esc(Core.decide(ACTOR.role, "SET_VERIFICATION_PASS"))}">—</span>`}
              <button data-fail="${esc(r.Requirement_ID)}">FAIL</button></td>
        </tr>`).join("")
      + `</tbody></table>`
      + (canPass ? "" : `<div class="note warn">当前角色 <code>${esc(ACTOR.role)}</code> 在权限矩阵中对「置 Verification_Result = PASS」为
          <b>${esc(Core.decide(ACTOR.role, "SET_VERIFICATION_PASS"))}</b>，因此该控件不渲染（不是禁用）。
          <span class="zh">The control is absent, not merely disabled, for a role the matrix refuses.</span></div>`));
  }

  function renderInheritance() {
    $("s-inheritance").innerHTML = panel("Inheritance / Regression",
      `<table><thead><tr><th>Capability</th><th>Baseline</th><th>Baseline_SHA</th>
        <th>Regression_Test_ID</th><th>Verification_Result</th><th></th></tr></thead><tbody>`
      + SESSION.inheritance.map(i => `<tr>
          <td><code>${esc(i.Capability_ID)}</code></td>
          <td>${esc(i.Baseline_Version)}</td>
          <td>${i.Baseline_SHA ? "<code>" + esc(String(i.Baseline_SHA).slice(0, 12)) + "…</code>" : '<span class="muted">—</span>'}</td>
          <td><code>${esc(i.Regression_Test_ID)}</code></td>
          <td>${pill(i.Verification_Result)}</td>
          <td>${i.Baseline_Locked ? '<span class="muted">held at PENDING</span>'
              : `<button data-inh-pass="${esc(i.Capability_ID)}">Mark PASS</button>`}</td>
        </tr>`).join("") + `</tbody></table>`);
  }

  function renderEvents() {
    $("s-events").innerHTML = panel("Event Review",
      `<table><thead><tr><th>Candidate_Event</th><th>Canonical_Event</th>
        <th>Event_Decision</th><th>State</th><th>Architect_Decision_ID</th></tr></thead><tbody>`
      + SESSION.events.map(e => `<tr>
          <td><code>${esc(e.Candidate_Event)}</code></td>
          <td>${e.Canonical_Event ? "<code>" + esc(e.Canonical_Event) + "</code>" : '<span class="muted">—</span>'}</td>
          <td>${pill(e.Decision)}</td>
          <td>${pill(Core.eventState(e))}</td>
          <td class="muted">${e.Architect_Decision_ID ? esc(e.Architect_Decision_ID) : "—"}</td>
        </tr>`).join("") + `</tbody></table>
        <div class="note">CONFLICT 且无 Architect_Decision_ID → 停在 PENDING，控制台不替架构师择一。
        <span class="zh">A conflict without an architect decision stays pending; the console does not choose for them.</span></div>`)
      + panel("Schema Delta",
        `<table><thead><tr><th>Item</th><th>Before</th><th>After</th><th>Classification</th><th>State</th></tr></thead><tbody>`
        + SESSION.schema_deltas.map(s => `<tr><td><code>${esc(s.Schema_Item_ID)}</code></td>
            <td class="muted">${esc(s.Before)}</td><td class="muted">${esc(s.After)}</td>
            <td>${pill(s.Classification)}</td><td>${pill(Core.deltaState(s))}</td></tr>`).join("")
        + `</tbody></table>`);
  }

  function renderDeliverables() {
    $("s-deliverables").innerHTML = panel("Deliverables",
      `<table><thead><tr><th>Artifact</th><th>SHA256</th><th>Purpose</th>
        <th>How to run</th><th>Expected</th><th>Limitation</th><th>Fact_Class</th><th></th></tr></thead><tbody>`
      + SESSION.deliverables.map(d => `<tr>
          <td><code>${esc(d.Name || d.Path)}</code></td>
          <td><code>${esc(String(d.SHA256 || "").slice(0, 12))}…</code></td>
          <td class="muted">${esc(d.Purpose)}</td>
          <td class="muted">${esc(d.How_To_Run)}</td>
          <td class="muted">${esc(d.Expected_Output)}</td>
          <td class="muted">${esc(d.Limitation)}</td>
          <td>${pill(d.Fact_Class)}</td>
          <td><button data-tf="${esc(d.Artifact_ID)}">Export as TEAM_FACT</button></td>
        </tr>`).join("") + `</tbody></table>
        <div id="tf-result">` + (EXPORT_RESULT
          ? (EXPORT_RESULT.ok
             ? `<div class="note">exported</div>`
             : `<div class="note bad">Refused — ${esc(EXPORT_RESULT.reason)}
                <span class="zh">Fact_Class=${esc(EXPORT_RESULT.factClass)} · export_as_team_fact=${esc(EXPORT_RESULT.flag)}</span></div>`)
          : "") + `</div>`);
  }

  function renderGate() {
    const canApprove = Core.may(ACTOR.role, "SET_GATE_APPROVED_RETURNED");
    const fails = Core.criticalFailures(SESSION);
    $("s-gate").innerHTML = panel("Gate",
      `<table><thead><tr><th>Gate</th><th>Gate_Status</th><th>Approver_Role</th>
        <th>Preconditions</th><th>Decision</th></tr></thead><tbody>`
      + SESSION.gates.map(g => `<tr><td><code>${esc(g.Gate_ID)}</code></td>
          <td>${pill(g.Gate_Status)}</td><td>${esc(g.Approver_Role)}</td>
          <td class="muted">${esc(g.Preconditions)}</td>
          <td class="muted">${g.Decision_ID ? esc(g.Decision_ID) : "—"}</td></tr>`).join("")
      + `</tbody></table>`
      + (canApprove
         ? `<div style="margin-top:10px"><button data-gate="APPROVED" class="primary">Gate APPROVED</button>
            <button data-gate="RETURNED">Gate RETURNED</button></div>`
         : `<div class="note warn">角色 <code>${esc(ACTOR.role)}</code> 对「置 Gate = APPROVED / RETURNED」为
            <b>${esc(Core.decide(ACTOR.role, "SET_GATE_APPROVED_RETURNED"))}</b> —— 控件不存在，不是禁用（A10）。
            <span class="zh">The control does not exist for this role, rather than existing and being disabled.</span></div>`)
      + (fails.length ? `<div class="note bad">${fails.length} 条 CRITICAL FAIL，Accept Development 被阻止（A08）。
            <span class="zh">A failing critical item blocks acceptance.</span></div>` : ""));
  }

  function renderAudit() {
    $("s-audit").innerHTML = panel(`Audit (${SESSION.audit.length})`,
      `<div class="tl">` + SESSION.audit.slice().reverse().map(a => `
        <div class="ev ${a.Refused ? "refused" : ""}">
          <div class="muted">${esc(a.Timestamp)} · ${esc(a.Actor_ID)} (${esc(a.Actor_Role)}) · rule ${esc(a.Rule_Version)}</div>
          <div><strong>${esc(a.Object_Type)}</strong> <code>${esc(a.Object_ID)}</code>
            ${a.Refused ? pill("REFUSED", "stop") : ""}</div>
          <div class="muted">${esc(JSON.stringify(a.Before))} → ${esc(JSON.stringify(a.After))}</div>
          ${a.Reason ? `<div class="muted">${esc(a.Reason)}</div>` : ""}
        </div>`).join("") + `</div>`);
  }

  function renderPack() {
    $("s-pack").innerHTML = panel(`Test Pack · ${esc(PACK.Test_Pack_ID)} · ${PACK.case_count} cases`,
      `<table><thead><tr><th>Test_ID</th><th>Surface</th><th>Canonical</th><th>Assertions</th></tr></thead><tbody>`
      + Core.cases().map(c => `<tr><td><code>${esc(c.Test_ID)}</code></td>
          <td>${pill(c.Surface, c.Surface === "DEVICE" ? "warn" : "dim")}</td>
          <td>${esc(c.canonical_en)}</td>
          <td class="muted">${(c.assertions || []).map(a => "· " + esc(a)).join("<br>")}</td></tr>`).join("")
      + `</tbody></table>
        <div class="note">本表为验收输入，控制台不自评结果：每条的 Verification_Result 需引用有效 Evidence_Binding，且 DEV 不得置 PASS。
        <span class="zh">The pack is input. The console does not mark its own results: each needs a valid evidence binding, and the developer role cannot set a pass.</span></div>`);
  }

  function render() {
    $("meta").innerHTML = `freeze <code>${esc(FREEZE.freeze_id)}</code> · schema <code>${esc(FREEZE.schema_version)}</code>`
      + ` · rules <code>${esc(FREEZE.rule_version)}</code> · pack <code>${esc(PACK.Test_Pack_ID)}</code>`;
    $("nav").innerHTML = TABS.map(([id, label]) =>
      `<button id="nav-${id}" data-tab="${id}" class="${id === CUR ? "on" : ""}">${esc(label)}</button>`).join("");
    if (!SESSION) {
      $("foot-status").textContent = "no review session — press 新建 Review";
      return;
    }
    renderOverview(); renderRequirements(); renderInheritance(); renderEvents();
    renderDeliverables(); renderGate(); renderAudit(); renderPack();
    TABS.forEach(([id]) => $("s-" + id).classList.toggle("on", id === CUR));
    const accept = Core.canAcceptDevelopment(SESSION);
    $("btn-accept").disabled = !accept;
    $("foot-status").innerHTML = `Review <code>${esc(SESSION.Review_ID.slice(0, 8))}…</code>`
      + ` · ${SESSION.audit.length} audit entries`
      + (accept ? "" : ` · <span style="color:var(--stop)">CRITICAL FAIL blocks acceptance</span>`);
  }

  /* ---- events ----------------------------------------------------------- */
  document.addEventListener("click", ev => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.tab) { CUR = t.dataset.tab; render(); return; }
    if (!SESSION) return;

    if (t.dataset.pass || t.dataset.inhPass) {
      const kindName = t.dataset.pass ? "requirement" : "inheritance";
      const id = t.dataset.pass || t.dataset.inhPass;
      // The only binding this console can offer is one that really exists.
      const binding = SESSION.bindings[0] || null;
      const r = Core.setVerification(SESSION, kindName, id, "PASS", ACTOR, binding);
      if (!r.ok) {
        alert("Refused — " + r.reason
              + (r.missing ? "\nMissing: " + r.missing.join(", ") : ""));
      }
      cache(); render(); return;
    }
    if (t.dataset.fail) {
      Core.setVerification(SESSION, "requirement", t.dataset.fail, "FAIL", ACTOR, null);
      cache(); render(); return;
    }
    if (t.dataset.gate) {
      const r = Core.setGate(SESSION, SESSION.gates[0].Gate_ID, t.dataset.gate, ACTOR);
      if (!r.ok) alert("Refused — " + r.reason);
      cache(); render(); return;
    }
    if (t.dataset.tf) {
      const d = SESSION.deliverables.find(x => x.Artifact_ID === t.dataset.tf);
      const r = Core.exportAsTeamFact(PRODUCT, d);
      EXPORT_RESULT = { ok: r.ok, reason: r.reason || "",
                        factClass: d.Fact_Class, flag: PRODUCT.export_as_team_fact };
      Core.audit(SESSION, { objectId: d.Artifact_ID, objectType: "Deliverable",
                            before: { Fact_Class: d.Fact_Class }, after: { Fact_Class: d.Fact_Class },
                            actorId: ACTOR.id, actorRole: ACTOR.role,
                            refused: !r.ok, reason: r.ok ? null : r.reason });
      cache(); render(); return;
    }
    if (t.id === "btn-new") { newSession(); return; }
    if (t.id === "btn-export") {
      const blob = new Blob([JSON.stringify(Core.exportReview(SESSION), null, 1)],
                            { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "review-" + SESSION.Review_ID.slice(0, 8) + ".json";
      a.click(); URL.revokeObjectURL(a.href);
      return;
    }
    if (t.id === "btn-import") { $("file").click(); return; }
    if (t.id === "btn-accept") {
      SESSION.Status = "ACCEPTED";
      Core.audit(SESSION, { objectId: SESSION.Review_ID, objectType: "Review_Session",
                            before: { Status: "IN_REVIEW" }, after: { Status: "ACCEPTED" },
                            actorId: ACTOR.id, actorRole: ACTOR.role });
      cache(); render(); return;
    }
  });

  $("file").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        SESSION = Core.importReview(JSON.parse(reader.result));  // Review_ID carried over
        cache(); render();
      } catch (err) { alert("Import failed: " + err.message); }
    };
    reader.readAsText(f);
  });

  $("product").addEventListener("change", e => {
    PRODUCT = PRODUCTS[Number(e.target.value)];
    newSession();
  });
  $("role").addEventListener("change", e => { ACTOR = { id: ACTOR.id, role: e.target.value }; render(); });

  /* ---- boot ------------------------------------------------------------- */
  $("product").innerHTML = PRODUCTS.map((p, i) =>
    `<option value="${i}">${esc(p.Product_ID)}</option>`).join("");
  $("role").innerHTML = Core.roles().map(r =>
    `<option value="${r}"${r === ACTOR.role ? " selected" : ""}>${esc(r)}</option>`).join("");
  const restored = restore();
  if (restored) { SESSION = restored; } else { SESSION = Core.createSession(PRODUCT, ACTOR); }
  render();
  window.__console = { Core, get session() { return SESSION; },
                       set actor(a) { ACTOR = a; render(); },
                       get actor() { return ACTOR; },
                       selectProduct(i) { PRODUCT = PRODUCTS[i]; newSession(); } };
