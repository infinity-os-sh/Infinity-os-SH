<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEMA MWE v0.2 — Strategy-to-Execution Control Tower</title>

<style>
:root{
  --bg:#0c1018;--panel:#141b26;--panel2:#1b2330;--line:#26303f;
  --ink:#e6ecf5;--dim:#8f9cb0;
  --accent:#4d8dff;--ok:#34d399;--warn:#f0b429;--stop:#f0685f;--hold:#a78bfa;
  --syn:#ff9d3d;--real:#4d8dff;--strat:#7dd3fc;
  --ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
       "Hiragino Sans GB","Microsoft YaHei",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--ui);
  font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#banner{position:sticky;top:0;z-index:50;padding:10px 20px;text-align:center;font-weight:700;
  letter-spacing:.06em;font-size:12.5px;border-bottom:2px solid var(--syn);color:var(--syn);
  background:repeating-linear-gradient(45deg,#3a2409,#3a2409 12px,#452b0b 12px,#452b0b 24px)}
#banner.real{border-bottom-color:var(--real);color:#a9c9ff;
  background:repeating-linear-gradient(45deg,#0f2242,#0f2242 12px,#132a50 12px,#132a50 24px)}
header{padding:16px 20px 0}
h1{font-size:18px;margin:0}
.sub{color:var(--dim);font-size:12px;margin-top:3px}
nav{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:8px;
  padding:10px 14px;font-size:13px;cursor:pointer;white-space:nowrap;min-height:44px;font-family:inherit}
nav button.on{background:#1d3a6b;border-color:#2f5ca8;color:#fff}
main{padding:16px 20px 90px;display:grid;gap:16px}
section{display:none}section.on{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel>h2{margin:0;padding:11px 14px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid var(--line);background:var(--panel2)}
.panel .body{padding:13px 14px;overflow-x:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 13px;
  cursor:pointer;display:grid;gap:6px;align-content:start}
.card:hover{border-color:var(--accent)}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .nm{font-weight:600;font-size:13.5px}
.card .bl{font-family:var(--mono);font-size:12px;color:var(--strat)}
.card .ln{font-size:11.5px;color:var(--dim)}
.card .ln b{color:var(--ink);font-weight:500}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
tbody tr[data-click]{cursor:pointer}tbody tr[data-click]:hover{background:#1b1f28}
code{font-family:var(--mono);font-size:11.5px;color:#c4d2ea;letter-spacing:-.01em}
td code,th code{white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid transparent;white-space:nowrap}
.p-ok{background:#0f2e21;color:var(--ok);border-color:#1d5c43}
.p-warn{background:#33270c;color:var(--warn);border-color:#6b5318}
.p-stop{background:#331416;color:var(--stop);border-color:#6b2a2e}
.p-hold{background:#241c3d;color:var(--hold);border-color:#443a72}
.p-dim{background:#1e222b;color:var(--dim);border-color:var(--line)}
/* Candidate and Hypothesis must never borrow the verified treatment (§10). */
.p-cand{background:#1a1f2e;color:#9db4d8;border-color:#33405a;border-style:dashed}
.p-hyp{background:#1d1a2e;color:#b9a8e0;border-color:#413a63;border-style:dashed}
.muted{color:var(--dim)}
.five{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;margin:0}
.five dt{color:var(--dim)}.five dd{margin:0}
.note{background:#1a2030;border:1px solid #2c3a57;border-left:3px solid var(--accent);
  border-radius:6px;padding:9px 12px;font-size:12.5px;color:#c4d2ea;margin:8px 0}
.note.bad{background:#2a1618;border-color:#5e2a2e;border-left-color:var(--stop);color:#f0c3c3}
.note.warn{background:#2a2210;border-color:#5e4a1e;border-left-color:var(--warn);color:#efdcb4}
.bridge{display:grid;gap:5px}
.step{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 11px}
.step.blocked{border-color:#5e2a2e;background:#221619}
.step .o{font-family:var(--mono);color:var(--dim);font-size:11.5px}
.step .why{font-size:11.5px;color:var(--dim);grid-column:2/4}
.srcs{display:grid;gap:5px;margin-top:5px}
.src{background:#1e222b;border:1px solid var(--line);border-left:3px solid var(--stop);
  border-radius:6px;padding:6px 9px;font-size:11.5px}
button.act{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:10px 14px;font-size:13px;cursor:pointer;margin:0 6px 6px 0;min-height:44px;font-family:inherit}
button.act:hover{border-color:var(--accent)}
button.act.primary{background:#1d3a6b;border-color:#2f5ca8}
.timeline{max-height:420px;overflow:auto;font-size:12px}
.ev{border-left:2px solid var(--line);padding:5px 0 5px 11px;margin-left:5px}
.ev.err{border-left-color:var(--stop)}.ev.human{border-left-color:var(--ok)}
.ev .t{color:var(--dim);font-size:11px}
.empty{color:var(--dim);padding:18px 0;text-align:center}
#tour{position:fixed;right:18px;bottom:18px;z-index:60;max-width:390px;background:#16233a;
  border:1px solid #2f5ca8;border-radius:12px;padding:15px 17px;box-shadow:0 12px 34px rgba(0,0,0,.55);display:none}
#tour.on{display:block}
#tour .step-n{color:var(--accent);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
#tour h3{margin:2px 0 5px;font-size:14.5px}
#tour p{margin:7px 0 11px;font-size:13px;color:#cfdcf0}
/* Bilingual layer. The Chinese sits beside the English, never replacing a
   canonical token: a state name is the registry's word and keeps its spelling. */
.zh{color:#a8bde0;font-weight:400}
h1 .zh,.panel>h2 .zh{display:block;font-size:.92em;margin-top:2px}
.note .zh,.card .ln .zh,td .zh,dd .zh{display:block}
.gl{color:var(--dim);font-size:11px;margin-left:4px;white-space:nowrap}
#lang{display:flex;gap:5px;margin-top:9px}
#lang button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);
  border-radius:7px;padding:7px 12px;font-size:12.5px;cursor:pointer;min-height:36px;font-family:inherit}
#lang button.on{background:#1d3a6b;border-color:#2f5ca8;color:#fff}
@media(max-width:720px){
  #tour{left:12px;right:12px;bottom:12px;max-width:none}
  header{padding:14px 16px 0}nav{padding:10px 16px}main{padding:14px 16px 90px}
  h1{font-size:16.5px}.cards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="banner"></div>

<header>
  <h1 id="h1"></h1>
  <div class="sub" id="meta"></div>
  <div id="lang"></div>
  <div style="margin-top:10px"><button class="act primary" id="tour-btn" onclick="tourStart()"></button></div>
</header>

<nav id="nav"></nav>
<main>
  <section id="s-p1"></section><section id="s-p2"></section><section id="s-p3"></section>
  <section id="s-p4"></section><section id="s-p5"></section><section id="s-p6"></section>
  <section id="s-p7"></section><section id="s-p8"></section>
</main>

<div id="tour">
  <div class="step-n" id="tour-step"></div>
  <h3 id="tour-title"></h3><p id="tour-body"></p>
  <button class="act primary" id="tour-next" onclick="tourNext()"></button>
  <button class="act" id="tour-exit" onclick="tourEnd()"></button>
</div>

ap_router":{"types":{"EXECUTION":{"route":"Execution Agent","page":"P5","ui":"inventory / listing / shelf / price / task evidence and the repair path","control":"RGM is not forced"},"OPPORTUNITY":{"route":"Strategic RGM","page":"P4","ui":"Occasion / Mission / Choice / Substitution","control":"insufficient evidence keeps every Lever LOCKED"},"MIXED":{"route":"Execution + RGM","page":"P4","ui":"dual-track labels, two evidence chains","control":"neither track may substitute for the other"},"EVIDENCE":{"route":"Evidence Agent","page":"P7","ui":"conflicting values, sources, time window, verifier","control":"root-cause upgrade is forbidden"},"UNKNOWN":{"route":"Hypothesis Checkpoint","page":"P7","ui":"the minimum next check","control":"forced judgement is forbidden"}},"routings":[{"tx_id":"TX004","routing_class":"EVIDENCE","route":"Evidence Agent","page":"P7","control":"root-cause upgrade is forbidden","fact_class":"CANDIDATE","note":"Evidence / Reclassify","rgm_required":false,"execution_required":false,"root_cause_upgrade_allowed":false},{"tx_id":"TX009","routing_class":"EVIDENCE","route":"Evidence Agent","page":"P7","control":"root-cause upgrade is forbidden","fact_class":"CANDIDATE","note":"Evidence Conflict; Execution Candidate behind it","rgm_required":false,"execution_required":false,"root_cause_upgrade_allowed":false},{"tx_id":"TX010","routing_class":"EVIDENCE","route":"Evidence Agent","page":"P7","control":"root-cause upgrade is forbidden","fact_class":"CANDIDATE","note":"quantity-basis Evidence Conflict -> possibly Opportunity","rgm_required":false,"execution_required":false,"root_cause_upgrade_allowed":false},{"tx_id":"TX011","routing_class":"EXECUTION","route":"Execution Agent","page":"P5","control":"RGM is not forced","fact_class":"CANDIDATE","note":"Execution Candidate","rgm_required":false,"execution_required":true,"root_cause_upgrade_allowed":true},{"tx_id":"TX012","routing_class":"EXECUTION","route":"Execution Agent","page":"P5","control":"RGM is not forced","fact_class":"CANDIDATE","note":"Surface cause evidenced; Deep Root Cause CANDIDATE","rgm_required":false,"execution_required":true,"root_cause_upgrade_allowed":true},{"tx_id":"TX013","routing_class":"OPPORTUNITY","route":"Strategic RGM","page":"P4","control":"insufficient evidence keeps every Lever LOCKED","fact_class":"CANDIDATE","note":"Opportunity Candidate","rgm_required":true,"execution_required":false,"root_cause_upgrade_allowed":true},{"tx_id":"TX014","routing_class":"OPPORTUNITY","route":"Strategic RGM","page":"P4","control":"insufficient evidence keeps every Lever LOCKED","fact_class":"CANDIDATE","note":"Opportunity Candidate","rgm_required":true,"execution_required":false,"root_cause_upgrade_allowed":true},{"tx_id":"TX015","routing_class":"OPPORTUNITY","route":"Strategic RGM","page":"P4","control":"insufficient evidence keeps every Lever LOCKED","fact_class":"CANDIDATE","note":"Opportunity Candidate","rgm_required":true,"execution_required":false,"root_cause_upgrade_allowed":true}]},"delta_events":{"_doc":"Taskbook §9. Each candidate event is resolved to REUSE, NEW or CONFLICT. A REUSE means the v0.2 concept travels on the existing canonical event — minting a synonym would create a second path to the same state and bypass the contract that guards it.","GAP_TYPE_CLASSIFIED":{"resolution":"NEW","direction":"inbound","object":"Gap","reason":"v0.1 classifies Gap_Class (GAP / POSITIVE_GAP / NO_ACTION / UNKNOWN / CONFLICT) from CTR-GAP-001. Routing_Class (EXECUTION / OPPORTUNITY / MIXED / EVIDENCE / UNKNOWN) is a different axis with no v0.1 equivalent. The event keeps its registered name: renaming it would mint a new event, which the correction taskbook §10 forbids. Its payload carries routing_class.","see_conflict":"CONFLICT-V02-001","payload_field":"routing_class"},"GAP_TYPE_RECLASSIFIED":{"resolution":"NEW","direction":"inbound","object":"Gap","reason":"no v0.1 event carries a classification change with before/after; required for the audit trail of a reclassification (T05). Renamed axis: the payload carries routing_class, while the event keeps its registered name (§10 forbids minting a new event).","payload_field":"routing_class"},"OPPORTUNITY_DIAGNOSIS_REQUESTED":{"resolution":"NEW","direction":"inbound","object":"Opportunity","reason":"v0.1 routes a diagnosed root cause to responsibility; it has no route into a strategic diagnosis."},"OCCASION_EVIDENCE_RECORDED":{"resolution":"REUSE","reuse_of":"EVIDENCE_SUBMITTED","carried_as":"evidence_type=OCCASION","reason":"This IS an evidence submission. A separate event would be a second evidence intake path that bypasses CTR-EVD-001 validation and the Evidence state machine — exactly the duplication §9 forbids."},"SUBSTITUTION_EVIDENCE_RECORDED":{"resolution":"REUSE","reuse_of":"EVIDENCE_SUBMITTED","carried_as":"evidence_type=SUBSTITUTION","reason":"Same as OCCASION_EVIDENCE_RECORDED: evidence intake already has one canonical door."},"CHOICE_SET_UPDATED":{"resolution":"NEW","direction":"inbound","object":"Choice_Set","reason":"no v0.1 object or event models a choice set."},"GROWTH_SOURCE_PROPOSED":{"resolution":"NEW","direction":"inbound","object":"Growth_Source","reason":"a proposal, not a dispatch; v0.1 has no proposal event."},"LEVER_PROPOSED":{"resolution":"NEW","direction":"inbound","object":"Growth_Lever","reason":"a proposal, not a dispatch. A Lever is NOT a Task: it does not enter the Task state machine and is never auto-issued."},"NET_INCREMENT_VERIFIED":{"resolution":"REUSE","reuse_of":"RESULT_WINDOW_CLOSED + CTR-RES-001 incrementality check","carried_as":"Result state INCREMENTALITY_CHECK -> VERIFIED","reason":"v0.1 already owns the only path to a verified increment, and it is gated on an independent verifier. A second event named VERIFIED would be a second way to mark something verified — the precise red line the Result machine exists to hold."},"NET_INCREMENT_BLOCKED":{"resolution":"NEW","direction":"outbound","object":"Budget_Bridge","reason":"Emitted when a leakage component is UNKNOWN. Overlaps in OUTCOME with the existing BLOCKED_ON_FINANCE status but not in CAUSE — see CONFLICT-V02-002; registered for the Chief Architect rather than silently merged.","see_conflict":"CONFLICT-V02-002"},"GATE_STATUS_CHANGED":{"resolution":"NEW","direction":"outbound","object":"Gate","reason":"v0.1 has no Gate object; DecisionRight decides per action, not per gate."}},"conflicts":{"CONFLICT-V02-001":{"severity":"NAMING","title":"RESOLVED — the v0.2 routing axis was named Gap_Type, too close to the v0.1 Gap_Class; renamed to Routing_Class","detail":"Historical record of a closed ruling. Gap_Class answers 'is there a gap and of what sign' (GAP / POSITIVE_GAP / NO_ACTION / UNKNOWN / CONFLICT). The routing axis answers 'which capability should handle it' (EXECUTION / OPPORTUNITY / MIXED / EVIDENCE / UNKNOWN). In v0.2 the second axis was called Gap_Type; both sat on the Gap object and both had an UNKNOWN and a CONFLICT-adjacent value, so a reader — or a later engineer — could conflate them. The Chief Architect closed this by keeping Gap_Class unchanged and renaming the routing axis to Routing_Class. The old name survives only in this record, in the two registered event names, and as a deprecated read-layer alias.","options":["rename Gap_Type to Routing_Class","rename Gap_Class to Gap_Sign","keep both and mandate the label everywhere"],"engineer_recommendation":"Routing_Class reads unambiguously and touches no v0.1 field. Not applied: renaming a v0.2 concept the taskbook named is the Architect's call.","status":"RESOLVED","resolved_by":"Chief Architect, INF-DEV-HEMA-003 §6 (2026-09-18)","resolution":"v0.1 Gap_Class is retained unchanged. The v0.2 routing axis is renamed Routing_Class across UI, data fields, the Router object, audit and event descriptions, the bilingual glossary and the tests. gap_type survives only as a deprecated read-layer alias."},"CONFLICT-V02-002":{"severity":"SEMANTIC","title":"NET_INCREMENT_BLOCKED overlaps BLOCKED_ON_FINANCE in outcome but not in cause","detail":"v0.1 sets roi_status=BLOCKED_ON_FINANCE when CFG-008 (Finance Margin Basis) is UNKNOWN. v0.2 blocks the bridge when a leakage component (cannibalization, migration, pull-forward, switch-out) is UNKNOWN. Both end in 'no ROI', and both are correct, but an operator seeing one blocked status cannot tell which input is missing unless the cause travels with it.","implemented":"v0.2 emits NET_INCREMENT_BLOCKED carrying the blocking step id, and leaves roi_status=BLOCKED_ON_FINANCE untouched. Nothing in v0.1 changes.","options":["keep both with distinct causes","merge into one BLOCKED status with a required cause field"],"status":"TODO-ARCHITECT"},"CONFLICT-V02-003":{"severity":"SCOPE","title":"The 8.59M Macro figure has no Evidence_ID in this taskbook","detail":"Taskbook §4 requires the Macro card to show '859万 = Existing Macro Candidate' with 'Evidence progress'. The figure is given; the evidence reference behind it is not. v0.2 renders it as CANDIDATE / REVALIDATION with evidence_id=UNKNOWN and an explicit 'Evidence reference not supplied' line, rather than implying an evidence trail that was not provided.","status":"TODO-ARCHITECT"}},"fact_classes":{"_doc":"Taskbook §10. Every value rendered anywhere in v0.2 carries one of these. TEAM_FACT and TEAM_PLAN are never assigned by the engine — only a human A with evidence may set them.","order":["TEAM_FACT","TEAM_PLAN","CANDIDATE","HYPOTHESIS","UNKNOWN","CONFLICT"],"verified_styling_allowed":["TEAM_FACT"],"engine_assignable":["CANDIDATE","HYPOTHESIS","UNKNOWN","CONFLICT"],"render":{"UNKNOWN":"— / UNKNOWN. Never 0.","CONFLICT":"every source, value and period shown side by side; no winner is picked","CANDIDATE":"must not reuse the styling of a verified value","HYPOTHESIS":"must not reuse the styling of a verified value"}},"delta_event_log":[{"event_type":"GAP_TYPE_RECLASSIFIED","tx_id":"TX004","actor":"evidence-agent","before":{"routing_class":"EVIDENCE"},"after":{"routing_class":"EVIDENCE"},"evidence_id":"SYN-EVD-RECLASS-004","reason":"trigger evidence and operational class disagree; routed to the Evidence Agent instead of being forced to a root cause","timestamp":"2026-09-18T00:00:03Z","fact_class":"CANDIDATE"},{"event_type":"NET_INCREMENT_BLOCKED","blocking_step":"INTERNAL_CANNIBALIZATION","timestamp":"2026-09-18T00:00:02Z","reason":"INTERNAL_CANNIBALIZATION is UNKNOWN — it is never treated as 0, because an unmeasured leakage assumed away turns a gross number into a net one that nobody can defend"}]}}</script>

ate / Audit","zh":"P7 证据 / Gate / 审计"},"tab.p8":{"en":"P8 Failure & Safety","zh":"P8 失败与安全"},"five.state":{"en":"Current State","zh":"当前状态"},"five.blocking":{"en":"Blocking Reason","zh":"阻塞原因"},"five.missing":{"en":"Missing Evidence","zh":"缺失的证据"},"five.owner":{"en":"Owner","zh":"责任人"},"five.next":{"en":"Next Allowed Transition","zh":"下一个允许的状态迁移"},"five.none":{"en":"none","zh":"无"},"five.nonemissing":{"en":"none outstanding","zh":"无未完成项"},"five.nonenext":{"en":"none — terminal or not authorized","zh":"无 —— 已到终态或未获授权"},"panel.state":{"en":"State","zh":"状态"},"p1.title":{"en":"Executive Control Tower — where is HEMA, and what is it stuck on?","zh":"高管控制塔 —— HEMA 现在在哪里，卡在什么地方？"},"p1.blocker":{"en":"Blocker","zh":"阻塞"},"p1.missing":{"en":"Missing","zh":"缺失"},"p1.owner":{"en":"Owner","zh":"责任人"},"p1.next":{"en":"Next","zh":"下一步"},"p1.forbidden":{"en":"must not display:","zh":"不得显示："},"p1.note":{"en":"Each card carries a contract: a Working Baseline it must show and claims it may never display. The build fails if a card asserts one of them, so this page cannot drift into announcing something that has not happened.","zh":"每张卡都带着一份契约：一条必须显示的工作基线，以及一组绝不可显示的声明。若某张卡断言了其中任何一条，构建就会失败 —— 因此这一页不可能慢慢漂移成宣布某件尚未发生的事。"},"p2.title":{"en":"Macro / Micro / Convergence","zh":"宏观 / 微观 / 收敛"},"th.layer":{"en":"Layer","zh":"层级"},"th.value":{"en":"Value","zh":"数值"},"th.state":{"en":"State","zh":"状态"},"th.basis":{"en":"Basis","zh":"口径"},"th.owner":{"en":"Owner","zh":"责任人"},"th.evidence":{"en":"Evidence","zh":"证据"},"p2.macro":{"en":"Macro (Category)","zh":"宏观（品类）"},"p2.micro":{"en":"Micro","zh":"微观"},"p2.conv":{"en":"Macro × Micro","zh":"宏观 × 微观"},"p2.universe":{"en":"Portfolio Universe","zh":"组合范围"},"p2.note":{"en":"A Category Macro figure and a single-SKU Micro figure are not subtractable. The engine refuses the arithmetic and reports <b>Object Basis Not Aligned</b> rather than producing a precise Planning Gap about nothing.","zh":"品类级的宏观数字与单品级的微观数字不可相减。引擎拒绝这次运算，报出<b>对象口径不一致</b>，而不是产出一个精确却毫无所指的规划缺口。"},"p3.title":{"en":"REAL-15 — Diagnosis","zh":"REAL-15 —— 诊断"},"p3.closure":{"en":"Closure","zh":"闭环"},"th.tx":{"en":"TX","zh":"晶体管"},"th.blocker":{"en":"Blocker","zh":"阻塞"},"th.rootcause":{"en":"Root Cause","zh":"根因"},"th.corrective":{"en":"Corrective","zh":"纠正动作"},"th.next":{"en":"Next","zh":"下一步"},"p3.note":{"en":"Routing_Class is the routing axis (which capability handles it). It is <b>not</b> the v0.1 Gap_Class (is there a gap, and of what sign). The axis was called Gap_Type in v0.2; CONFLICT-V02-001 registered the naming hazard and the Chief Architect closed it by this rename. The old name survives only as a deprecated read-layer alias.","zh":"Routing_Class 是路由维度（由哪类能力处理）。它<b>不是</b> v0.1 的 Gap_Class（有没有缺口、方向为何）。这个维度在 v0.2 中曾名为 Gap_Type；CONFLICT-V02-001 登记了该命名隐患，首席架构师以本次改名予其关闭。旧名称仅作为读取层的弃用别名保留。"},"p3.state":{"en":"DIAGNOSIS → ROOT CAUSE","zh":"诊断 → 根因"},"p3.rgmreq":{"en":"RGM required","zh":"需要 RGM"},"p3.execreq":{"en":"Execution required","zh":"需要执行"},"p3.upgrade":{"en":"Root-cause upgrade allowed","zh":"允许升级为根因"},"p4.opps":{"en":"Opportunities (TX013–015)","zh":"机会（TX013–015）"},"th.opp":{"en":"Opportunity","zh":"机会"},"th.gap":{"en":"Gap","zh":"缺口"},"th.store":{"en":"Store","zh":"门店"},"th.factclass":{"en":"Fact class","zh":"事实分级"},"p4.oppnote":{"en":"Every Opportunity carries the Gap it came from. No second Target graph is created.","zh":"每个机会都带着它所来自的那个缺口。不会另建第二张目标图。"},"p4.hyp":{"en":"Occasion / Need State / Shopper Mission","zh":"消费场合 / 需求状态 / 购物任务"},"th.object":{"en":"Object","zh":"对象"},"th.kind":{"en":"Kind","zh":"类别"},"th.desc":{"en":"Description","zh":"描述"},"p4.hypnote":{"en":"Unverified is HYPOTHESIS, and a hypothesis is never styled as a verified fact.","zh":"未经核验的就是 HYPOTHESIS（假设），而假设绝不会被套上「已核验事实」的样式。"},"p4.choice":{"en":"Choice Set & Substitution","zh":"选择集与替代"},"th.choiceset":{"en":"Choice Set","zh":"选择集"},"th.options":{"en":"Options","zh":"选项"},"th.nopurchase":{"en":"No Purchase","zh":"包含不购买"},"th.subst":{"en":"Substitution","zh":"替代"},"th.from":{"en":"From","zh":"从"},"th.to":{"en":"To","zh":"到"},"th.prob":{"en":"Probability","zh":"概率"},"p4.choicenote":{"en":"A choice set always offers <b>NO_PURCHASE</b> — without it every lost sale gets attributed to a competitor. An unmeasured switching probability stays UNKNOWN; filling it with 0 would assert that no switching happens.","zh":"选择集始终包含 <b>NO_PURCHASE</b>（不购买）—— 否则每一笔流失的销售都会被归因给竞争对手。未测量的转换概率保持 UNKNOWN；填 0 等于断言「不存在转换」。"},"p4.lever":{"en":"Growth Source → Growth Lever","zh":"增长来源 → 增长杠杆"},"th.lever":{"en":"Lever","zh":"杠杆"},"th.action":{"en":"Action","zh":"动作"},"th.missingev":{"en":"Missing evidence","zh":"缺失的证据"},"th.why":{"en":"Why","zh":"原因"},"p4.levernote":{"en":"A Lever is not a Task. It never enters the Task state machine and is never auto-issued. With evidence incomplete it shows <b>LOCKED / NOT YET ALLOWED</b>; with evidence complete it is still only a proposal for a human A.","zh":"杠杆不是任务。它不进入任务状态机，也绝不自动派发。证据不完整时显示 <b>LOCKED / 尚不允许</b>；即便证据完整，它也仍然只是一份提交给人工负责人 A 的提案。"},"p4.inc":{"en":"Incrementality — three bases, never summed","zh":"增量性 —— 三种口径，绝不相加"},"th.basis2":{"en":"Basis","zh":"口径"},"p4.incnote":{"en":"Category, Company and Channel/Store incrementality are different questions. Adding them double-counts.","zh":"品类增量、公司增量、渠道/门店增量是三个不同的问题。把它们相加就是重复计算。"},"p4.state":{"en":"LIVE CANDIDATE","zh":"在用候选"},"p5.title":{"en":"Store → SKU → Gap → Responsibility → Task → Evidence → Result (inherited from v0.1)","zh":"门店 → 单品 → 缺口 → 责任 → 任务 → 证据 → 结果（继承自 v0.1）"},"th.resp":{"en":"Responsibility","zh":"责任"},"th.task":{"en":"Task","zh":"任务"},"th.result":{"en":"Result","zh":"结果"},"p5.note":{"en":"Unchanged from v0.1. Execution evidence closes the Task; the Result stays PENDING and ROI stays BLOCKED_ON_FINANCE. Doing the work is not proof the business moved.","zh":"与 v0.1 完全一致。执行证据关闭任务；结果仍为 PENDING，ROI 仍为 BLOCKED_ON_FINANCE。把活干完，并不等于证明业务动了。"},"p6.title":{"en":"Gross → Leakage → Net Increment → CM → ROI → Release / Stop","zh":"毛结果 → 漏损 → 净增量 → 贡献毛利 → ROI → 放行 / 停止"},"p6.blockedat":{"en":"Blocked at","zh":"受阻于"},"p6.note":{"en":"An UNKNOWN leakage component is never treated as 0: assuming it away is exactly how a GMV increase becomes a fabricated ROI.","zh":"任何为 UNKNOWN 的漏损成分都不会被当作 0：把它假设掉，正是 GMV 增长变成编造出来的 ROI 的那条路径。"},"p6.state":{"en":"ATTRIBUTION DESIGN","zh":"归因设计"},"p7.gates":{"en":"Gates","zh":"各 Gate"},"th.gate":{"en":"Gate","zh":"Gate"},"th.status":{"en":"Status","zh":"状态"},"p7.gatenote":{"en":"The Scale gate offers no control at all — there is nothing here to mis-click.","zh":"扩量 Gate 完全没有提供任何控件 —— 这里没有任何东西可供误点。"},"p7.dr":{"en":"DecisionRight","zh":"决策权"},"th.verdict":{"en":"Verdict","zh":"判定"},"th.basis3":{"en":"Basis","zh":"依据"},"p7.events":{"en":"v0.2 delta events (schema delta registry)","zh":"v0.2 增量事件（Schema Delta 注册表）"},"th.candev":{"en":"Candidate event","zh":"候选事件"},"th.resolution":{"en":"Resolution","zh":"处置"},"th.reason":{"en":"Reason","zh":"理由"},"p7.eventnote":{"en":"Three candidate events already had a canonical v0.1 equivalent. Minting a synonym would have created a second path to the same state — so they travel on the existing event instead.","zh":"三个候选事件在 v0.1 中已有规范对应项。另造一个同义事件，等于开出通往同一状态的第二条路径 —— 因此它们改走既有事件。"},"p7.conflicts":{"en":"Registered conflicts (TODO-ARCHITECT)","zh":"已登记的冲突（TODO-ARCHITECT）"},"p7.audit":{"en":"Audit timeline (v0.1 inherited + v0.2 delta)","zh":"审计时间线（v0.1 继承 + v0.2 增量）"},"p7.rule":{"en":"Rule","zh":"规则"},"p7.config":{"en":"Config v","zh":"配置 v"},"p7.evidence":{"en":"evidence","zh":"证据"},"p7.engine":{"en":"engine","zh":"引擎"},"p7.state":{"en":"GATES OPEN","zh":"各 Gate 开放中"},"p8.title":{"en":"Failure demonstrations (inherited from v0.1)","zh":"失败演示（继承自 v0.1）"},"p8.wrong":{"en":"Done wrong:","zh":"错误操作："},"p8.note":{"en":"All four cases end in a safe stop or a safe degradation. Nothing proceeds.","zh":"四个案例全部以安全停止或安全降级收场。没有任何一个继续往下走。"},"p8.add":{"en":"v0.2 safety additions","zh":"v0.2 新增的安全性"},"p8.addnote":{"en":"UNKNOWN renders as <b>—</b>, never 0. CONFLICT shows every source side by side and picks no winner. A Growth Lever without evidence is LOCKED. The Scale card exposes no control. A card that tried to assert a forbidden claim would fail the build, not the review.","zh":"UNKNOWN 渲染为 <b>—</b>，绝不为 0。CONFLICT 并列展示每一个来源，不裁定胜者。没有证据的增长杠杆处于 LOCKED。扩量卡不暴露任何控件。若某张卡试图断言一条被禁止的声明，失败的是构建，而不是评审。"},"p8.state":{"en":"SAFE","zh":"安全"},"p8.safeblock":{"en":"none — all four failure cases stop safely","zh":"无 —— 四个失败案例全部安全停止"},"p8.owner":{"en":"Lead Engineer","zh":"主任工程师"},"p8.next":{"en":"Architect review","zh":"架构师评审"},"t1.h":{"en":"Executive","zh":"高管视图"},"t1.b":{"en":"Eight cards: where HEMA is and what each layer is stuck on. Every card shows its Working Baseline, its blocker, its missing evidence, its owner and the next allowed transition.","zh":"八张卡：HEMA 现在在哪里，每一层卡在什么地方。每张卡都显示它的工作基线、阻塞、缺失的证据、责任人，以及下一个允许的状态迁移。"},"t2.h":{"en":"Target & Convergence","zh":"目标与收敛"},"t2.b":{"en":"The 8.59M Macro is a CANDIDATE under REVALIDATION — not approved, and its evidence reference was never supplied. Macro × Micro is on HOLD because the object bases do not align.","zh":"859 万的宏观值是一个处于 REVALIDATION 的 CANDIDATE —— 未被批准，且其证据引用从未提供。宏观 × 微观处于 HOLD，因为对象口径不一致。"},"t3.h":{"en":"Why convergence is on HOLD","zh":"收敛为何处于 HOLD"},"t3.b":{"en":"A Category figure minus a single-SKU figure is a precise number about nothing. The engine refuses the subtraction instead of producing a Planning Gap.","zh":"品类级数字减去单品级数字，得到的是一个精确却毫无所指的数字。引擎拒绝这次相减，而不是产出一个规划缺口。"},"t4.h":{"en":"REAL-15","zh":"REAL-15"},"t4.b":{"en":"Fifteen transistors, each with a Gap_Type that routes it: Execution, Opportunity, Mixed, Evidence or Unknown. Click any row to see its routing and its evidence conflict.","zh":"十五颗晶体管，每颗都有一个用于路由的 Gap_Type：执行、机会、混合、证据或未知。点击任意一行可查看它的路由与证据冲突。"},"t5.h":{"en":"Evidence conflicts","zh":"证据冲突"},"t5.b":{"en":"TX009 has an app-reported quantity and an unperformed backroom count. Both are shown, with their meanings. Neither is rendered as the other, and no root cause is forced.","zh":"TX009 同时有一个 App 上报数量和一次未执行的后仓盘点。两者都被展示，并各自标明含义。任何一个都不会被渲染成另一个，也不会强行给出根因。"},"t6.h":{"en":"Strategic RGM","zh":"战略 RGM"},"t6.b":{"en":"TX013–015 became Opportunities. Occasion, Need State and Mission are HYPOTHESIS until evidence arrives — and a hypothesis never wears the styling of a verified fact.","zh":"TX013–015 成为机会。消费场合、需求状态与购物任务在证据到达之前都是 HYPOTHESIS —— 而假设绝不会穿上「已核验事实」的样式。"},"t7.h":{"en":"Levers stay locked","zh":"杠杆保持锁定"},"t7.b":{"en":"Both Growth Levers are LOCKED because their evidence is incomplete. A Lever is not a Task: it is never auto-issued, and releasing one is a human decision.","zh":"两个增长杠杆都处于 LOCKED，因为它们的证据不完整。杠杆不是任务：它绝不自动派发，放开它是人的决定。"},"t8.h":{"en":"Execution","zh":"执行"},"t8.b":{"en":"The v0.1 chain, unchanged. Execution evidence closes the Task; the Result stays PENDING and ROI stays BLOCKED_ON_FINANCE.","zh":"v0.1 的执行链，未作改动。执行证据关闭任务；结果仍为 PENDING，ROI 仍为 BLOCKED_ON_FINANCE。"},"t9.h":{"en":"Budget bridge","zh":"预算增量桥"},"t9.b":{"en":"Eleven steps from gross to release. It blocks at step 2 because cannibalization is UNKNOWN — and UNKNOWN is never treated as 0. That is how a GMV increase would otherwise become a fabricated ROI.","zh":"从毛结果到放行共十一步。它在第 2 步受阻，因为蚕食为 UNKNOWN —— 而 UNKNOWN 绝不按 0 处理。否则，GMV 的增长就会变成一个编造出来的 ROI。"},"t10.h":{"en":"Gates and delta events","zh":"各 Gate 与增量事件"},"t10.b":{"en":"Three candidate events already had a canonical v0.1 equivalent and were reused rather than duplicated. Three conflicts are registered for the Architect rather than decided here.","zh":"三个候选事件在 v0.1 中已有规范对应项，因此被复用而非重复造出。三条冲突被登记给架构师，而不是在这里裁决。"},"t11.h":{"en":"Failure & safety","zh":"失败与安全"},"t11.b":{"en":"Duplicate event, wrong Store_ID, missing PERSON, high-risk action — all four stop safely, inherited from v0.1 and still green.","zh":"重复事件、错误的 Store_ID、缺失的 PERSON、高风险动作 —— 四者全部安全停止，继承自 v0.1 且依然全绿。"},"t12.h":{"en":"What this is not","zh":"这不是什么"},"t12.b":{"en":"Not production. Not a 15→100 scale authorization. Not Working Loop Closed. The Scale card offers no control ehind the Macro candidate":"宏观候选值背后的证据引用","Portfolio Universe definition":"组合范围（Portfolio Universe）的定义","an aligned object basis for Macro and Micro":"宏观与微观之间口径一致的对象基准","aligned object basis":"口径一致的对象基准","align object basis":"对齐对象口径","Architect review":"架构师评审","Architect review of the v0.2 delta":"对 v0.2 增量的架构师评审","revalidate":"重新验证","revalidate Macro candidate":"重新验证宏观候选值","supply evidence":"补充证据","close CFG-008":"关闭 CFG-008","close Portfolio Universe":"界定组合范围","close the owning gate":"关闭对应的 Gate","requires Finance evidence":"需要财务证据","CFG-008 Finance Margin Basis UNKNOWN":"CFG-008 财务毛利口径为 UNKNOWN","CFG-007 manual confirm on Low-SPPD":"CFG-007 对低 SPPD 的人工确认","manual confirm outstanding on the Low-SPPD transistors":"低 SPPD 晶体管的人工确认尚未完成","CFG-010 scale gate threshold":"CFG-010 扩量 Gate 阈值","decided by the authorised Gate Approver":"由获授权的 Gate 批准人决定","Risk Level Map (CFG-003)":"风险等级映射表（CFG-003）","DecisionRight matrix":"决策权矩阵","neither track may substitute for the other":"两条轨道不可互相替代","Verified only after an independent V":"仅在独立核验人（V）确认后才算已核验","insufficient evidence keeps every Lever LOCKED":"证据不足，所有增长杠杆保持 LOCKED","record Occasion evidence":"记录场合证据","record Substitution evidence":"记录替代证据","record leakage evidence":"记录漏损证据","Strategic RGM diagnosis":"战略 RGM 诊断","Evidence reclassification":"证据重分类","Evidence Agent reclassification":"证据代理重分类","classification under review":"分类正在复核","operational classification":"运营侧分类","trigger evidence":"触发证据","physical backroom count — not performed":"后仓实物盘点 —— 未执行","DISPLAY":"陈列","CONVERSION":"转化","SUBSTITUTION":"替代","LIFECYCLE_EXIT":"生命周期退出","SUPPLY_SHORTAGE":"上游供应短缺","REPLENISHMENT_NOT_TRIGGERED":"补货未触发","display is adverse and explains the low SPPD":"陈列不利，可解释低 SPPD","conversion is adverse and explains the low SPPD":"转化不利，可解释低 SPPD","no dimension explains the low SPPD with the evidence supplied":"以现有证据，没有任何维度能解释低 SPPD","upstream supply is short; cause is not the store":"上游供应短缺；原因不在门店","replenishment did not trigger for an available supply" serted":"任务已派发但未被接受；接受 SLA（CFG-001）无法判定，因此不断言超时","CFG-009 (PARTIAL): evidence/gate table incomplete; gates are not auto-closed -> PENDING_APPROVAL":"CFG-009（部分closed）：证据/Gate 对应表不完整；Gate 不自动关闭 → PENDING_APPROVAL","Shelf/Display Check":"货架/陈列检查","shelf availability candidate":"货架可得性候选","occasion evidence missing":"缺少场合证据","substitution evidence missing":"缺少替代证据","evidence incomplete: OCCASION, SUBSTITUTION — NOT YET ALLOWED":"证据不完整：OCCASION、SUBSTITUTION —— 尚不允许放行","evidence incomplete: SUBSTITUTION, FINANCE — NOT YET ALLOWED":"证据不完整：SUBSTITUTION、FINANCE —— 尚不允许放行","Price investment on the switch-in pack":"转入规格上的价格投入","requires an approved attribution rule":"需要一条已批准的归因规则","approved formula; unclosed = BLOCKED":"已批准的公式；未关闭即 BLOCKED","upstream step INTERNAL_CANNIBALIZATION is not closed":"上游步骤 INTERNAL_CANNIBALIZATION 未关闭","verified sales / volume / GMV observation; not a net increment":"已核验的销售/销量/GMV 观测值；不是净增量","verified increment requires a value and an independent verifier":"已核验增量需要同时具备数值与独立核验人","a gross GMV or sales observation is not a company increment; the leakage bridge has not been walked":"毛 GMV 或销售观测值不是公司增量；漏损桥尚未走完","INTERNAL_CANNIBALIZATION is UNKNOWN — it is never treated as 0, because an unmeasured leakage assumed away turns a gross number into a net one that nobody can defend":"INTERNAL_CANNIBALIZATION 为 UNKNOWN —— 绝不按 0 处理。把未测量的漏损假设为零，就是把一个毛数字变成无人能辩护的净数字","wrong-store":"门店错误","missing-person":"人员缺失","duplicate-event":"重复事件","high-risk-action":"高风险动作","the same event, with the same idempotency key, delivered twice":"同一事件、同一幂等键，被投递两次","a diagnosis event for a Store_ID that was never loaded, then an Actual for the same unknown store":"针对从未载入的 Store_ID 的诊断事件，随后又收到同一未知门店的实际值","a PRICE_CHANGE requested for automatic dispatch, then a backup takeover of it, then an action absent from the approved whitelist":"请求自动派发一项 PRICE_CHANGE，随后请求备份接管，再请求一项不在已批准白名单内的动作","The bus recognised the idempotency key and dropped the event; no handler ran, so no second Task and no second resource booking. A genuinely new event for the same (Gap, Task_Type) is also refused, by the derived Task id.":"事件总线识别出幂等键并丢弃该事件；没有处理器运行，因此不会产生第二个任务、也不会重复占用资源。即便是针对同一 (Gap, Task_Type) 的全新事件，也会被派生出的 Task ID 拒绝。","The diagnosis stopped with HEMA-E-NOT_FOUND: the engine will not invent a Gap for an object it has no Target for. The stray Actual is stored and visible, but it produces no Gap and no Task — data that arrives for an unknown store is held, not acted on.":"诊断以 HEMA-E-NOT_FOUND 停止：对于没有目标的对象，引擎不会凭空造出一个 Gap。那条孤立的实际值会被存储并可见，但不产生 Gap、也不产生任务 —— 来自未知门店的数据只被保留，不被执行。","No Task was issued and no individual was named — the engine never invents a PERSON. The gap stays detected and diagnosed, and the manager receives an ENSURE management action, not an Execution Task.":"没有派发任务，也没有指名任何个人 —— 引擎绝不虚构 PERSON。缺口保持在已检出、已诊断状态，主管收到的是一条 ENSURE 管理动作，而不是一项执行任务。","PRICE_CHANGE is HIGH in the approved Risk Level Map, so the Task was created but left ASSIGNED / PENDING_APPROVAL — never issued. A backup cannot take it over either. An action absent from the whitelist is equally refused: unmapped means pending, never an inferred LOW.":"在已批准的风险等级映射表中 PRICE_CHANGE 为高风险，因此任务被创建但停留在 ASSIGNED / PENDING_APPROVAL —— 从未派发。备份人员也无法接管。不在白名单内的动作同样被拒绝：未映射即待批准，绝不推断为低风险。","Object Basis Not Aligned — a Category Macro figure and a single-SKU Micro figure are not subtractable":"对象口径不一致 —— 品类级宏观数字与单品级微观数字不可相减","trigger evidence and operational class disagree; routed to the Evidence Agent instead of being forced to a root cause":"触发证据与运营侧分类互相矛盾；转交证据代理处理，而不是强行给出根因","NET_INCREMENT_BLOCKED overlaps BLOCKED_ON_FINANCE in outcome but not in cause":"NET_INCREMENT_BLOCKED 与 BLOCKED_ON_FINANCE 在结果上重叠，但在原因上不同","v0.1 sets roi_status=BLOCKED_ON_FINANCE when CFG-008 (Finance Margin Basis) is UNKNOWN. v0.2 blocks the bridge when a leakage component (cannibalization, migration, pull-forward, switch-out) is UNKNOWN. Both end in 'no ROI', and both are correct, but an operator seeing one blocked status cannot tell which input is missing unless the cause travels with it.":"当 CFG-008（财务毛利口径）为 UNKNOWN 时，v0.1 会把 roi_status 置为 BLOCKED_ON_FINANCE。当某个漏损成分（蚕食、迁移、需求提前、转移流出）为 UNKNOWN 时，v0.2 会阻断增量桥。两者的结局都是「没有 ROI」，也都正确；但操作者只看到一个受阻状态时，如果原因不随之传递，就无法判断究竟缺哪一项输入。","The 8.59M Macro figure has no Evidence_ID in this taskbook":"任务书中的 859 万宏观数字没有 Evidence_ID","Taskbook §4 requires the Macro card to show '859万 = Existing Macro Candidate' with 'Evidence progress'. The figure is given; the evidence reference behind it is not. v0.2 renders it as CANDIDATE / REVALIDATION with evidence_id=UNKNOWN and an explicit 'Evidence reference not supplied' line, rather than implying an evidence trail that was not provided.":"任务书 §4 要求宏观卡显示「859万 = 现有宏观候选」并附「证据进度」。数字给了，但其背后的证据引用没有给。v0.2 因此将它呈现为 CANDIDATE / REVALIDATION，evidence_id=UNKNOWN，并明确标出「证据引用未提供」一行，而不是暗示存在一条并未提供的证据链。","v0.1 routes a diagnosed root cause to responsibility; it has no route into a strategic diagnosis.":"v0.1 把已诊断的根因转向责任归属；它没有通往战略诊断的路径。","no v0.1 object or event models a choice set.":"v0.1 没有任何对象或事件刻画「选择集」。","a proposal, not a dispatch; v0.1 has no proposal event.":"这是一次提案，不是派发；v0.1 没有提案类事件。","a proposal, not a dispatch. A Lever is NOT a Task: it does not enter the Task state machine and is never auto-issued.":"这是一次提案，不是派发。杠杆不是任务：它不进入任务状态机，也绝不自动派发。","Emitted when a leakage component is UNKNOWN. Overlaps in OUTCOME with the existing BLOCKED_ON_FINANCE status but not in CAUSE — see CONFLICT-V02-002; registered for the Chief Architect rather than silently merged.":"当某个漏损成分为 UNKNOWN 时发出。它与既有的 BLOCKED_ON_FINANCE 在「结果」上重叠，但在「原因」上不同 —— 见 CONFLICT-V02-002；已登记给首席架构师，而不是被悄悄合并。","v0.1 has no Gate object; DecisionRight decides per action, not per gate.":"v0.1 没有 Gate 对象；决策权是按动作判定的，不是按 Gate 判定的。","This IS an evidence submission. A separate event would be a second evidence intake path that bypasses CTR-EVD-001 validation and the Evidence state machine — exactly the duplication §9 forbids.":"这本身就是一次证据提交。另设一个事件等于开出第二条证据入口，绕过 CTR-EVD-001 校验与证据状态机 —— 正是 §9 所禁止的重复。","Same as OCCASION_EVIDENCE_RECORDED: evidence intake already has one canonical door.":"与 OCCASION_EVIDENCE_RECORDED 同理：证据入口已经有一扇规范之门。","v0.1 already owns the only path to a verified increment, and it is gated on an independent verifier. A second event named VERIFIED would be a second way to mark something verified — the precise red line the Result machine exists to hold.":"通往「已核验增量」的唯一路径已由 v0.1 掌握，且以独立核验人为闸口。再设一个名为 VERIFIED 的事件，就等于多出第二种把事情标记为已核验的方式 —— 而这正是结果状态机存在所要守住的红线。","Business Confirm PENDING on 15/15; manual confirm outstanding on the Low-SPPD transistors; CFG-008 Finance Margin Basis UNKNOWN; 15→100 Scale is not authorized":"15/15 颗待业务确认；低 SPPD 晶体管的人工确认尚未完成；CFG-008 财务毛利口径为 UNKNOWN；15→100 扩量未获授权","3 objects share root cause SUPPLY_SHORTAGE; one upstream functional action is proposed instead of 3 identical store tasks":"3 个对象共享根因 SUPPLY_SHORTAGE；提案 1 个上游职能动作，而非 3 个重复的门店任务","5 objects share root cause REPLENISHMENT_NOT_TRIGGERED; one upstream functional action is proposed instead of 5 identical store tasks":"5 个对象共享根因 REPLENISHMENT_NOT_TRIGGERED；提案 1 个上游职能动作，而非 5 个重复的门店任务","stock basis unresolved: an app quantity and an unperformed physical count":"库存口径未解决：一个 App 数量，加一次未执行的实物盘点","split Physical Backroom / Shelf Qty / App Available Qty, then reclassify":"先拆分 后仓实物库存 / 货架数量 / App 可售数量，再重新分类","app-reported available quantity — not a physical count":"App 上报的可售数量 —— 不是实物盘点","three stock bases disagree and none is verified":"三种库存口径互相矛盾，且没有一个经过核验","unify Physical Backroom, Shelf Qty and App Available Qty, then decide whether this is an Opportunity":"先统一 后仓实物库存、货架数量、App 可售数量，再决定这是否是一个机会","Physical Backroom 4 / Shelf 8":"后仓实物 4 / 货架 8","App Available 4 / Shelf Image 5 / Physical Backroom UNKNOWN":"App 可售 4 / 货架照片 5 / 后仓实物 UNKNOWN","team diagnosis, pending verification":"团队诊断，待核验","independent verifier and shelf photograph":"独立核验人与货架照片","delisted front and back of store; not sellable":"前后场下架 / 不可售","last-place elimination":"末位淘汰","Independent V / system or interview confirmation pending":"等待独立核验人 / 系统或访谈确认","Evidence Collection / Verification only until the Deep Root Cause is verified":"在深层根因核验前，只允许证据采集 / 核验","Root Cause Verification":"根因核验","home dinner stir-fry":"家庭晚餐炒菜","cold-dressed light dishes":"凉拌轻食","dipping for high-quality ingredients":"高品质食材蘸食","umami, light salt, zero additives, does not mask the ingredient's own taste":"鲜味、轻盐、0 添加、不遮盖食材原味","buy a condiment the whole family can use for tonight's dinner":"为今晚家庭晚餐购买适合全家使用的调味品","Shelf/Display Check at the dinner-occasion location":"在晚餐场合位置执行货架/陈列检查","PEER_BASELINE (below peer) vs LOCAL_DEMAND (no local demand signal)":"PEER_BASELINE（低于同类）对 LOCAL_DEMAND（无本地需求信号）","a peer-versus-demand disagreement is a diagnosis argument, not the quantity-basis evidence conflict this transistor actually has; showing it as the current working view described a case nobody was working on":"同类比较与需求信号之争是一场诊断争论，而不是这颗晶体管真正存在的数量口径证据冲突；把它当作当前工作视图，描述的是一个没人在处理的情形","P8 synthetic test case":"P8 合成测试用例","INF-DEV-HEMA-003 COR-02":"INF-DEV-HEMA-003 COR-02","RESOLVED — the v0.2 routing axis was named Gap_Type, too close to the v0.1 Gap_Class; renamed to Routing_Class":"已解决 —— v0.2 的路由维度原名 Gap_Type，与 v0.1 的 Gap_Class 过于接近；已改名为 Routing_Class","Coverage/OOS":"覆盖率 / 缺货","Low-SPPD":"低 SPPD","stock_on_hand: sources disagree; no value is chosen":"stock_on_hand：各来源互相矛盾；不选定任何数值","stock_quantity_basis: sources disagree; no value is chosen":"stock_quantity_basis：各来源互相矛盾；不选定任何数值","trigger_basis: sources disagree; no value is chosen":"trigger_basis：各来源互相矛盾；不选定任何数值","Historical record of a closed ruling. Gap_Class answers 'is there a gap and of what sign' (GAP / POSITIVE_GAP / NO_ACTION / UNKNOWN / CONFLICT). The routing axis answers 'which capability should handle it' (EXECUTION / OPPORTUNITY / MIXED / EVIDENCE / UNKNOWN). In v0.2 the second axis was called Gap_Type; both sat on the Gap object and both had an UNKNOWN and a CONFLICT-adjacent value, so a reader — or a later engineer — could conflate them. The Chief Architect closed this by keeping Gap_Class unchanged and renaming the routing axis to Routing_Class. The old name survives only in this record, in the two registered event names, and as a deprecated read-layer alias.":"已关闭裁决的历史记录。Gap_Class 回答的是「有没有缺口、方向为何」（GAP / POSITIVE_GAP / NO_ACTION / UNKNOWN / CONFLICT）。路由维度回答的是「应由哪类能力处理」（EXECUTION / OPPORTUNITY / MIXED / EVIDENCE / UNKNOWN）。在 v0.2 中，第二个维度名为 Gap_Type；两者都挂在 Gap 对象上，都有 UNKNOWN 以及与 CONFLICT 相邻的取值，因此读者 —— 或后来的工程师 —— 可能把它们混为一谈。首席架构师的裁决是：保持 Gap_Class 不变，将路由维度改名为 Routing_Class。旧名称仅存续于本记录、两个已注册的事件名，以及一个弃用的读取层别名之中。","no v0.1 event carries a classification change with before/after; required for the audit trail of a reclassification (T05). Renamed axis: the payload carries routing_class, while the event keeps its registered name (§10 forbids minting a new event).":"v0.1 没有任何事件携带带前后值的分类变更；而重分类的审计轨迹（T05）需要它。维度已改名：事件载荷携带 routing_class，而事件本身保留其已注册的名称（§10 禁止新造事件）。","v0.1 classifies Gap_Class (GAP / POSITIVE_GAP / NO_ACTION / UNKNOWN / CONFLICT) from CTR-GAP-001. Routing_Class (EXECUTION / OPPORTUNITY / MIXED / EVIDENCE / UNKNOWN) is a different axis with no v0.1 equivalent. The event keeps its registered name: renaming it would mint a new event, which the correction taskbook §10 forbids. Its payload carries routing_class.":"v0.1 依 CTR-GAP-001 判定 Gap_Class（GAP / POSITIVE_GAP / NO_ACTION / UNKNOWN / CONFLICT）。Routing_Class（EXECUTION / OPPORTUNITY / MIXED / EVIDENCE / UNKNOWN）是另一个维度，在 v0.1 中没有对应项。该事件保留其已注册的名称：改名等于新造一个事件，而修正任务书 §10 禁止这样做。其载荷携带 routing_class。"},"tokens":{"UNKNOWN":"未知","CONFLICT":"冲突","CANDIDATE":"候选","HYPOTHESIS":"假设","TEAM_FACT":"团队事实","TEAM_PLAN":"团队计划","GAP":"缺口","POSITIVE_GAP":"正向缺口","EXECUTION":"执行","OPPORTUNITY":"机会","MIXED":"混合","EVIDENCE":"证据","OPEN":"开放","WORKING":"在用","HOLD":"暂停","WAITING":"等待中","BLOCKED":"受阻","LOCKED":"锁定","ISSUED":"已派发","ACCEPTED":"已接受","ASSIGNED":"已指派","IN_PROGRESS":"进行中","COMPLETED":"已完成","RESOLVED":"已解决","NEEDS_MORE":"需补充","REVALIDATION":"重新验证","PENDING_APPROVAL":"待人工批准","NOT_AUTHORIZED":"未授权","NOT AUTHORIZED":"未授权","NOT CLAIMED":"未声明","AUTO ALLOWED":"允许自动执行","HUMAN APPROVAL REQUIRED":"需人工批准","ANY ACTION NOT LISTED":"未列出的任何动作","SAFE STOP":"安全停止","SAFE DEGRADATION":"安全降级","WORKING USE":"在用","DELTA DEVELOPMENT":"增量开发中","ATTRIBUTION DESIGN":"归因设计","LIVE CANDIDATE":"在用候选","DIAGNOSIS":"诊断","DIAGNOSIS -> ROOT CAUSE":"诊断 → 根因","DIAGNOSIS_DRAFT":"诊断草稿","DIAGNOSIS_INCOMPLETE":"诊断未完成","DIAGNOSIS_TASK":"诊断任务","ROOT_CAUSE_CANDIDATE":"根因候选","EVIDENCE_GAP":"证据缺口","EVIDENCE_CONFLICT":"证据冲突","EVIDENCE_REVIEW":"证据审核","EVIDENCE_SUBMITTED":"证据已提交","EVIDENCE_COLLECTION":"证据采集","EXECUTION_CANDIDATE":"执行候选","OPPORTUNITY_CANDIDATE":"机会候选","RESPONSIBILITY_GAP":"责任缺口","RESULT_OPENED":"结果窗口开启","BLOCKED_ON_FINANCE":"受阻于财务口径","FINANCE_BASIS":"财务口径","FORMAL_BUDGET":"正式预算","GROSS_RESULT":"毛结果","INTERNAL_CANNIBALIZATION":"内部蚕食","PRICE_INVESTMENT_LEAKAGE":"价格投入漏损","RETURNS_OTHER_LEAKAGE":"退货及其他漏损","PULL_FORWARD":"需求提前","SWITCH_OUT":"转移流出","CHANNEL_MIGRATION":"渠道迁移","VERIFIED_NET_INCREMENT":"已核验净增量","INCREMENTAL_CONTRIBUTION_MARGIN":"增量贡献毛利","ROI":"投资回报","NEXT_RELEASE_OR_STOP":"下一步放行或停止","CATEGORY":"品类","COMPANY":"公司","CHANNEL_STORE":"渠道/门店","NO_PURCHASE":"不购买","OCCASION":"消费场合","NEED_STATE":"需求状态","SHOPPER_MISSION":"购物任务","STRATEGIC_TARGET":"战略目标","Strategic RGM":"战略 RGM","Execution + RGM":"执行 + RGM","Execution Agent":"执行代理","Evidence Agent":"证据代理","Hypothesis Checkpoint":"假设检查点","REUSE":"复用","NEW":"新增","TRANSITION":"状态迁移","NAMING":"命名","SEMANTIC":"语义","SCOPE":"范围","TARGET_INGESTED":"目标已接入","ACTUAL_INGESTED":"实际已接入","ROLE_MAPPING_INGESTED":"角色映射已接入","GAP_DETECT":"缺口检测","TASK_DRAFT":"任务草稿","TASK_NOT_ISSUED":"任务未派发","TASK_PENDING_APPROVAL":"任务待批准","TASK_DISPATCH_LOW_RISK":"低风险任务派发","BACKUP_TAKEOVER_LOW_RISK":"低风险备份接管","TAKEOVER":"接管","MANAGEMENT_ACTION":"管理动作","ManagementAction":"管理动作","CONFIG_DEGRADATION":"配置降级","GAP_TYPE_CLASSIFIED":"缺口类型已分类","GAP_TYPE_RECLASSIFIED":"缺口类型已重分类","OPPORTUNITY_DIAGNOSIS_REQUESTED":"已请求机会诊断","CHOICE_SET_UPDATED":"选择集已更新","GROWTH_SOURCE_PROPOSED":"增长来源已提案","LEVER_PROPOSED":"杠杆已提案","NET_INCREMENT_BLOCKED":"净增量受阻","NET_INCREMENT_VERIFIED":"净增量已核验","GATE_STATUS_CHANGED":"Gate 状态已变更","OCCASION_EVIDENCE_RECORDED":"场合证据已记录","SUBSTITUTION_EVIDENCE_RECORDED":"替代证据已记录","RESULT_WINDOW_CLOSED + CTR-RES-001 incrementality check":"结果窗口关闭 + CTR-RES-001 增量性检查","PRICE_CHANGE":"价格变更","BUDGET_RELEASE_OR_TRANSFER":"预算放行或调拨","PROMOTION_COMMITMENT":"促销承诺","CUSTOMER_COMMITMENT":"客户承诺","PRODUCT_EXIT":"产品退出","MAJOR_CHANNEL_COMMITMENT":"重大渠道承诺","MAJOR_INCENTIVE":"重大激励","CASH_INCENTIVE":"现金激励","IRREVERSIBLE_ACTION":"不可逆动作","SCALE_15_TO_100":"15→100 扩量","INVENTORY_CHECK":"库存盘查","SHELF_DISPLAY_CHECK":"货架/陈列检查","LISTING_STATUS_CHECK":"上架状态检查","O2O_AVAILABILITY_CHECK":"O2O 可售检查","Target":"目标","Actual":"实际","Gap":"缺口","Responsibility":"责任","Task":"任务","Evidence":"证据","Result":"结果","RoleMapping":"角色映射","SKU":"单品","HUMAN":"人工","AGENT":"代理","SYSTEM":"系统","Production Ready":"生产就绪","Approved":"已批准","Closure":"闭环","Config":"配置","Category Micro complete":"品类微观已完备","final Planning Gap":"最终规划缺口","any actionable Scale control":"任何可操作的扩量控件","GMV rendered directly as ROI":"把 GMV 直接当作 ROI 呈现","Hypothesis shown as Fact":"把假设当作事实展示","TEAM_DIAGNOSIS":"团队诊断","INDEPENDENT_V":"独立核验","APP_AVAILABLE_QTY":"App 可售数量","PHYSICAL_BACKROOM":"后仓实物库存","CROSS-CATEGORY-SOLUTION":"跨品类调味方案","OPERATIONAL_CLASS":"运营侧分类","TRIGGER_EVIDENCE":"触发证据","RETIRED":"已退役","YES":"是","NO":"否"},"patterns":[["^task (TSK-[0-9A-F]+) issued$","任务 $1 已派发"],["^assigned to (SYN-[A-Z0-9-]+)$","已指派给 $1"],["^(SYN-[A-Z0-9-]+) started work$","$1 已开始执行"],["^(SYN-[A-Z0-9-]+) accepted the task$","$1 已接受任务"],["^(SYN-[A-Z0-9-]+) takes over from (SYN-[A-Z0-9-]+)$","$1 接管 $2 的任务"],["^evidence (SYN-EVD-[A-Z0-9]+) accepted$","证据 $1 已接受"],["^responsibility gap on (GAP-[0-9A-F]+): no role mapping supplied for this object; responsibility is not assigned by the engine$","$1 存在责任缺口：该对象未提供角色映射；引擎不会自行指派责任"],["^(\\d+) objects share root cause ([A-Z_]+); one upstream functional action is proposed instead of (\\d+) identical store tasks$","$1 个对象共享根因 $2；提案 1 个上游职能动作，而非 $3 个重复的门店任务"],["^(\\d+) of (\\d+) evidence references supplied$","已提供 $1/$2 份证据引用"],["^(\\d+) of (\\d+) Levers are LOCKED — evidence incomplete$","$1/$2 个增长杠杆处于 LOCKED：证据不完整"],["^observed change ([\\d.]+) \\(NOT a verified increment\\)$","观测到变化 $1（不是已核验的增量）"]]}</script>
<script>
"use strict";
const D=JSON.parse(document.getElementById('v02-data').textContent);
const I18N=JSON.parse(document.getElementById('v02-i18n').textContent);
const V1=D.v01, V2=D.v02;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* --- language ------------------------------------------------------------
   Three settings: en, zh, both. A canonical token (state name, fact class,
   Gap_Type, event name) is never translated — it is the word the registry, the
   audit log and the specification use, and a translated state name would be a
   second vocabulary for the same state. Tokens keep their spelling and carry a
   Chinese gloss beside them. */
let LANG='both';
try{const s=localStorage.getItem('hema-v02-lang'); if(s) LANG=s;}catch(e){}

const LANGS=[['en','EN'],['zh','中文'],['both','EN + 中文']];
function setLang(l){LANG=l; try{localStorage.setItem('hema-v02-lang',l);}catch(e){} paint();}

/* Template prose. Values may carry inline <b>, so they are not escaped. */
function T(k){const e=I18N.ui[k]; if(!e) return '['+k+']';
  if(LANG==='en') return e.en;
  if(LANG==='zh') return e.zh;
  return e.en+' <span class="zh">'+e.zh+'</span>';}
/* Plain text, for textContent and for a title attribute. */
function Tt(k){const e=I18N.ui[k]; if(!e) return k;
  if(LANG==='en') return e.en;
  if(LANG==='zh') return e.zh;
  return e.en+'  ·  '+e.zh;}

/* Engine-emitted prose: exact entry, else a pattern for strings carrying a
   derived id. Coverage is enforced by scripts/hema_i18n_audit.py and a test, so
   a missing entry is a build-time failure, not a silent English fallback. */
function tr(s){const ex=I18N.engine[s]; if(ex) return ex;
  for(const pair of (I18N.patterns||[])){const m=new RegExp(pair[0]).exec(s);
    if(m){let o=pair[1];
      for(let i=1;i<m.length;i++){o=o.split('$'+i).join(m[i]||'');}
      return o;}}
  return null;}
function E(s){if(s===null||s===undefined||s==='') return '';
  const zh=tr(String(s));
  if(LANG==='en'||!zh) return esc(s);
  if(LANG==='zh') return esc(zh);
  return esc(s)+' <span class="zh">'+esc(zh)+'</span>';}
function Elist(a,sep){return (a||[]).map(x=>E(x)).join(sep||'; ');}

/* A canonical token plus its gloss. */
function gl(t){const g=I18N.tokens[String(t)];
  return (LANG!=='en'&&g)?'<span class="gl">'+esc(g)+'</span>':'';}

const OK=['ISSUED','ACCEPTED','IN_PROGRESS','COMPLETED','RESOLVED','VERIFIED','CLOSED','TEAM_FACT','OPEN','PASSED','AUTO ALLOWED'];
const WARN=['PENDING_APPROVAL','PENDING APPROVAL','NEEDS_MORE','PENDING','WAITING','RESULT_PENDING','EXCEPTION','ASSIGNED','REVALIDATION','HOLD','ATTRIBUTION DESIGN','HUMAN APPROVAL REQUIRED','WORKING USE','DELTA DEVELOPMENT'];
const STOP=['CONFLICT','STOP','REJECTED','BLOCKED','LOCKED','NOT AUTHORIZED','NOT_AUTHORIZED','RESPONSIBILITY_GAP'];
const HOLD=['UNKNOWN','PROPOSAL','VISIBILITY','NOT_ISSUED','NOT_DIAGNOSED','NOT CLAIMED'];
function kind(s){s=String(s||'').toUpperCase();
  if(s==='CANDIDATE')return'cand'; if(s==='HYPOTHESIS')return'hyp';
  if(OK.includes(s))return'ok'; if(WARN.includes(s))return'warn';
  if(STOP.includes(s))return'stop'; if(HOLD.includes(s))return'hold'; return'dim';}
const pill=(t,k)=>`<span class="pill p-${k||kind(t)}">${esc(t)}</span>${gl(t)}`;
const panel=(t,b)=>`<div class="panel"><h2>${t}</h2><div class="body">${b}</div></div>`;
/* A fact renders through one function so UNKNOWN is a dash everywhere and a
   CONFLICT always shows every source. */
function fact(f){
  if(!f) return '<span class="muted">—</span>';
  if(f.fact_class==='CONFLICT'){
    return pill('CONFLICT','stop')+`<div class="srcs">`+
      (f.sources||[]).map(s=>`<div class="src"><code>${esc(s.source)}</code> = <b>${s.value===null?'—':esc(s.value)}</b>`+
        (s.meaning?` <span class="muted">· ${E(s.meaning)}</span>`:'')+
        (s.period?` <span class="muted">· ${esc(s.period)}</span>`:'')+`</div>`).join('')+
      `</div>`+(f.note?`<div class="muted" style="margin-top:4px">${E(f.note)}</div>`:'');
  }
  const v=f.display==='—'?'<span class="muted">—</span>':esc(f.display);
  return `${v} ${pill(f.fact_class)}`;
}
const five=o=>`<dl class="five">
  <dt>${T('five.state')}</dt><dd>${o.state?pill(o.state):'<span class="muted">—</span>'}</dd>
  <dt>${T('five.blocking')}</dt><dd>${E(o.blocking)||'<span class="muted">'+T('five.none')+'</span>'}</dd>
  <dt>${T('five.missing')}</dt><dd>${(o.missing||[]).length?'<ul style="margin:0;padding-left:16px">'+o.missing.map(m=>`<li>${E(m)}</li>`).join('')+'</ul>':'<span class="muted">'+T('five.nonemissing')+'</span>'}</dd>
  <dt>${T('five.owner')}</dt><dd>${E(o.owner)||'—'}</dd>
  <dt>${T('five.next')}</dt><dd>${(o.next||[]).length?o.next.map(n=>E(n)).join(' · '):'<span class="muted">'+T('five.nonenext')+'</span>'}</dd></dl>`;

const TABS=['p1','p2','p3','p4','p5','p6','p7','p8'];
let CUR='p1';
function go(id){CUR=id;TABS.forEach(t=>{$('s-'+t).classList.toggle('on',t===id);$('nav-'+t).classList.toggle('on',t===id);});
  window.scrollTo({top:0,behavior:'smooth'});}

function paint(){
  $('banner').innerHTML=T('banner');
  $('h1').innerHTML=T('title');
  $('tour-btn').textContent=Tt('tour.start');
  $('tour-next').textContent=Tt('tour.next');
  $('tour-exit').textContent=Tt('tour.exit');
  $('lang').innerHTML=LANGS.map(([c,l])=>
    `<button class="${c===LANG?'on':''}" onclick="setLang('${c}')" aria-pressed="${c===LANG}">${esc(l)}</button>`).join('');
  $('nav').innerHTML=TABS.map(i=>`<button id="nav-${i}" onclick="go('${i}')">${Tt('tab.'+i)}</button>`).join('');
  $('meta').innerHTML=`${Tt('meta.inherited')} (${V1.chain.length} ${Tt('meta.transistors')}, ${Tt('meta.rules')} <code>${esc(V1.config.rule_version)}</code>) `
    +`· ${Tt('meta.delta')} (${V2.executive.length} ${Tt('meta.cards')}) · ${Tt('meta.riskmap')} <code>${esc(V1.config.decision_id)}</code>`;

  /* P1 Executive */
  $('s-p1').innerHTML=panel(T('p1.title'),
    `<div class="cards">`+V2.executive.map(c=>`<div class="card" onclick="go('${esc(c.drill.toLowerCase())}')">
        <div class="hd"><span class="nm">${E(c.title)}</span>${pill(c.fact_class)}</div>
        <div class="bl">${E(c.baseline)}</div>
        <div class="ln"><b>${T('p1.blocker')}</b> ${E(c.blocking_reason)||'—'}</div>
        <div class="ln"><b>${T('p1.missing')}</b> ${Elist(c.missing_evidence)||'—'}</div>
        <div class="ln"><b>${T('p1.owner')}</b> ${E(c.owner)}</div>
        <div class="ln"><b>${T('p1.next')}</b> ${Elist(c.next_allowed_transition,', ')||Tt('five.none')}</div>
        <div class="ln muted">${T('p1.forbidden')} ${c.forbidden.map(f=>esc(f)+gl(f)).join(', ')}</div></div>`).join('')+`</div>
     <div class="note">${T('p1.note')}</div>`);

  /* P2 Target & Convergence */
  const T2=V2.target;
  $('s-p2').innerHTML=
    panel(T('p2.title'),
     `<table><thead><tr><th>${T('th.layer')}</th><th>${T('th.value')}</th><th>${T('th.state')}</th><th>${T('th.basis')}</th><th>${T('th.owner')}</th><th>${T('th.evidence')}</th></tr></thead><tbody>
      <tr><td>${T('p2.macro')}</td><td>${fact(T2.macro)}</td><td>${pill(T2.macro.state)}</td><td><code>${esc(T2.macro.basis)}</code>${gl(T2.macro.basis)}</td><td>${E(T2.macro.owner)}</td><td class="muted">${E(T2.macro.evidence_progress)}</td></tr>
      <tr><td>${T('p2.micro')} (<code>${esc(T2.micro.sku_id)}</code>)</td><td>${fact(T2.micro)}</td><td>${pill(T2.micro.state)}</td><td><code>${esc(T2.micro.basis)}</code>${gl(T2.micro.basis)}</td><td>${E(T2.micro.owner)}</td><td class="muted">${T('p2.universe')} ${pill(T2.micro.portfolio_universe)}</td></tr>
      <tr><td>${T('p2.conv')}</td><td>${fact(T2.convergence)}</td><td>${pill(T2.convergence_state)}</td><td><code>MISALIGNED</code></td><td>${E(T2.owner)}</td><td class="muted">—</td></tr>
      </tbody></table>
      <div class="note bad">${T('p2.note')}</div>`)
  + panel(T('panel.state'), five({state:T2.convergence_state, blocking:T2.blocking_reason, missing:T2.missing_evidence, owner:T2.owner, next:T2.next_allowed_transition}));

  /* P3 REAL-15 */
  const R=V2.real15;
  $('s-p3').innerHTML=
    panel(`${T('p3.title')} ${pill(R.diagnosis_complete)} · ${T('p3.closure')} ${pill(R.closure)}`,
     `<table><thead><tr><th>${T('th.tx')}</th><th>${T('th.routingclass')}</th><th>${T('th.state')}</th><th>${T('th.blocker')}</th><th>${T('th.rootcause')}</th><th>${T('th.corrective')}</th><th>${T('th.next')}</th></tr></thead><tbody>`
     +R.transistors.map(t=>`<tr data-click onclick="showTx('${esc(t.tx)}')">
        <td><code>${esc(t.tx)}</code></td>
        <td>${pill(t.routing_class)}${t.secondary_class?' '+pill(t.secondary_class,'dim'):''}
            <div class="muted">${esc(t.routing.route)}${gl(t.routing.route)}</div></td>
        <td>${pill(t.state)}</td><td class="muted">${E(t.blocker)||'—'}</td>
        <td>${t.root_cause?`<div>${T('p3.surface')} ${E(t.root_cause)} ${pill(t.root_cause_fact_class||'CANDIDATE')}</div>`:'<span class="muted">—</span>'}
            ${t.deep_root_cause?`<div style="margin-top:4px">${T('p3.deep')} ${E(t.deep_root_cause.value)} ${pill(t.deep_root_cause.fact_class)}
              <div class="muted">${T('p3.notverified')}</div></div>`:''}</td>
        <td class="muted">${E(t.corrective)||'—'}</td><td class="muted">${E(t.next)}</td></tr>`).join('')
     +`</tbody></table>
       <div class="note">${T('p3.note')}</div>
       <div id="tx-detail"></div>`)
  + panel(T('panel.state'), five({state:Tt('p3.state'), blocking:R.blocking_reason, missing:R.missing_evidence, owner:R.owner, next:R.next_allowed_transition}));

  /* P4 Strategic RGM */
  const G=V2.rgm;
  $('s-p4').innerHTML=
    panel(T('p4.opps'),
     `<table><thead><tr><th>${T('th.opp')}</th><th>${T('th.tx')}</th><th>${T('th.gap')}</th><th>${T('th.store')}</th><th>${T('th.factclass')}</th></tr></thead><tbody>`
     +G.opportunities.map(o=>`<tr><td><code>${esc(o.opportunity_id)}</code></td><td><code>${esc(o.tx_id)}</code></td>
       <td><code>${esc(o.gap_id)}</code></td><td><code>${esc(o.store_id)}</code></td><td>${pill(o.fact_class)}</td></tr>`).join('')
     +`</tbody></table><div class="note">${T('p4.oppnote')}</div>`)
  + panel(T('p4.hyp'),
     `<table><thead><tr><th>${T('th.object')}</th><th>${T('th.kind')}</th><th>${T('th.desc')}</th><th>${T('th.evidence')}</th><th>${T('th.factclass')}</th></tr></thead><tbody>`
     +G.hypotheses.map(h=>`<tr><td><code>${esc(h.object_id)}</code></td><td>${esc(h.kind)}${gl(h.kind)}</td><td>${E(h.description)}</td>
       <td class="muted">${esc(h.evidence_id)||'—'}</td><td>${pill(h.fact_class)}</td></tr>`).join('')
     +`</tbody></table><div class="note warn">${T('p4.hypnote')}</div>`)
  + panel(T('p4.choice'),
     `<table><thead><tr><th>${T('th.choiceset')}</th><th>${T('th.options')}</th><th>${T('th.nopurchase')}</th></tr></thead><tbody>`
     +G.choice_sets.map(c=>`<tr><td><code>${esc(c.choice_set_id)}</code></td>
       <td>${c.options.map(o=>pill(o,'dim')).join(' ')}</td><td>${c.allows_no_purchase?pill('YES','ok'):pill('NO','stop')}</td></tr>`).join('')
     +`</tbody></table>
       <table style="margin-top:10px"><thead><tr><th>${T('th.subst')}</th><th>${T('th.from')}</th><th>${T('th.to')}</th><th>${T('th.prob')}</th></tr></thead><tbody>`
     +G.substitute_sets.map(s=>`<tr><td><code>${esc(s.substitute_set_id)}</code></td><td><code>${esc(s.switch_from)}</code></td>
       <td><code>${esc(s.switch_to)}</code></td><td>${fact(s.probability)}</td></tr>`).join('')
     +`</tbody></table>
       <div class="note">${T('p4.choicenote')}</div>`)
  + panel(T('p4.lever'),
     `<table><thead><tr><th>${T('th.lever')}</th><th>${T('th.action')}</th><th>${T('th.state')}</th><th>${T('th.missingev')}</th><th>${T('th.why')}</th></tr></thead><tbody>`
     +G.levers.map(l=>`<tr><td><code>${esc(l.lever_id)}</code></td><td>${E(l.action)}</td>
       <td>${pill(l.state)}</td><td class="muted">${Elist(l.missing_evidence,', ')||'—'}</td>
       <td class="muted">${E(l.blocking_reason)}</td></tr>`).join('')
     +`</tbody></table><div class="note bad">${T('p4.levernote')}</div>`)
  + panel(T('p4.inc'),
     G.incrementality.map(i=>`<table><thead><tr><th>${T('th.basis2')}</th><th>${T('th.value')}</th></tr></thead><tbody>`
       +Object.entries(i.bases).map(([b,f])=>`<tr><td><code>${esc(b)}</code>${gl(b)}</td><td>${fact(f)}</td></tr>`).join('')
       +`</tbody></table>`).join('')
     +`<div class="note">${T('p4.incnote')}</div>`)
  + panel(T('panel.state'), five({state:Tt('p4.state'), blocking:G.blocking_reason, missing:G.missing_evidence, owner:G.owner, next:G.next_allowed_transition}));

  /* P5 Execution — inherited from v0.1 unchanged */
  $('s-p5').innerHTML=panel(T('p5.title'),
    `<table><thead><tr><th>${T('th.tx')}</th><th>${T('th.store')}</th><th>${T('th.gap')}</th><th>${T('th.rootcause')}</th><th>${T('th.resp')}</th><th>${T('th.task')}</th><th>${T('th.evidence')}</th><th>${T('th.result')}</th></tr></thead><tbody>`
    +V1.chain.map(r=>`<tr><td><code>${esc(r.tx)}</code></td><td><code>${esc(r.store_id)}</code></td>
      <td>${pill(r.gap.class)} ${r.gap.value===null?'<span class="muted">—</span>':esc(r.gap.value)}</td>
      <td class="muted">${E(r.gap.root_cause||'')}</td>
      <td>${r.responsibility?pill(r.responsibility.state):'<span class="muted">—</span>'}</td>
      <td>${(r.tasks||[]).map(t=>pill(t.state)+' '+pill(t.mode)).join(' ')||'<span class="muted">—</span>'}</td>
      <td>${(r.evidence||[]).map(e=>pill(e.state)).join(' ')||'<span class="muted">—</span>'}</td>
      <td>${r.result?pill(r.result.state)+`<div class="muted">${esc(r.result.roi_status)}${gl(r.result.roi_status)}</div>`:'<span class="muted">—</span>'}</td></tr>`).join('')
    +`</tbody></table>
      <div class="note">${T('p5.note')}</div>`);

  /* P6 Budget */
  const B=V2.budget;
  $('s-p6').innerHTML=
    panel(T('p6.title'),
     `<div class="bridge">`+B.steps.map(s=>`<div class="step${s.status==='BLOCKED'?' blocked':''}">
        <span class="o">${s.order}</span><span><b>${esc(s.step_id)}</b>${gl(s.step_id)} — ${fact(s.value)}</span>${pill(s.status)}
        <span class="why">${E(s.blocking_reason||s.rule)}</span></div>`).join('')+`</div>
      <div class="note bad">${T('p6.blockedat')} <b>${esc(B.blocked_at||'—')}</b>${gl(B.blocked_at)}. ${T('p6.note')}</div>
      <div class="note">${E(B.gross_is_not_company_increment.note)}</div>`)
  + panel(T('panel.state'), five({state:Tt('p6.state'), blocking:B.blocking_reason, missing:B.missing_evidence, owner:B.owner, next:B.next_allowed_transition}));

  /* P7 Evidence / DecisionRight / Gate / Audit */
  const GT=V2.gates;
  $('s-p7').innerHTML=
    panel(T('p7.gates'),`<table><thead><tr><th>${T('th.gate')}</th><th>${T('th.status')}</th><th>${T('th.blocker')}</th><th>${T('th.owner')}</th></tr></thead><tbody>`
     +GT.gates.map(g=>`<tr><td><code>${esc(g.gate_id)}</code></td><td>${pill(g.status)}</td>
       <td class="muted">${E(g.blocker)}</td><td>${E(g.owner)}</td></tr>`).join('')
     +`</tbody></table><div class="note bad">${T('p7.gatenote')}</div>`)
  + panel(T('p7.dr'),`<table><thead><tr><th>${T('th.action')}</th><th>${T('th.verdict')}</th><th>${T('th.basis3')}</th></tr></thead><tbody>`
     +V1.decision_rights.slice(0,40).map(d=>`<tr><td><code>${esc(d.action)}</code>${gl(d.action)}</td><td>${pill(d.verdict)}</td>
       <td class="muted">${E(d.scope)}</td></tr>`).join('')+`</tbody></table>`)
  + panel(T('p7.events'),
     `<table><thead><tr><th>${T('th.candev')}</th><th>${T('th.resolution')}</th><th>${T('th.reason')}</th></tr></thead><tbody>`
     +Object.entries(V2.delta_events).filter(([k])=>!k.startsWith('_')).map(([k,v])=>`<tr><td><code>${esc(k)}</code>${gl(k)}</td>
       <td>${pill(v.resolution==='REUSE'?'REUSE':'NEW',v.resolution==='REUSE'?'ok':'warn')}${v.reuse_of?`<div class="muted">→ <code>${esc(v.reuse_of)}</code>${gl(v.reuse_of)}</div>`:''}</td>
       <td class="muted">${E(v.reason)}</td></tr>`).join('')+`</tbody></table>
       <div class="note">${T('p7.eventnote')}</div>`)
  + panel(T('p7.conflicts'),
     Object.entries(V2.conflicts).map(([k,c])=>`<div class="note warn"><b>${esc(k)}</b> · ${esc(c.severity)}${gl(c.severity)} — ${E(c.title)}
       <div class="muted" style="margin-top:4px">${E(c.detail)}</div></div>`).join(''))
  + panel(T('p7.audit'),
     `<div class="note">${T('p7.rule')} <code>${esc(V1.audit.rule_version)}</code> · ${T('p7.config')}${esc(V1.audit.config_version)}</div>
      <div class="timeline">`
     +(V2.delta_event_log||[]).map(e=>`<div class="ev human"><div class="t">${esc(e.timestamp)} · ${esc(e.actor||Tt('p7.engine'))} · ${Tt('p7.evidence')} ${esc(e.evidence_id||'—')}</div>
        <div><strong>${esc(e.event_type)}</strong>${gl(e.event_type)} <code>${esc(e.tx_id||e.blocking_step||'')}</code>
        ${e.before?` <code>${esc(JSON.stringify(e.before))} → ${esc(JSON.stringify(e.after))}</code>`:''}</div>
        <div class="muted">${E(e.reason||'')}</div></div>`).join('')
     +V1.audit.entries.slice().reverse().slice(0,120).map(e=>`<div class="ev ${e.error_code?'err':(e.actor_type==='HUMAN'?'human':'')}">
        <div class="t">${esc(e.timestamp)} · ${esc(e.actor)} (${esc(e.actor_type)}${gl(e.actor_type)}) · ${Tt('p7.rule')} ${esc(e.rule_version)}</div>
        <div><strong>${esc(e.action)}</strong>${gl(e.action)} ${esc(e.object_type)}:<code>${esc(e.object_id)}</code>
        ${(e.before&&e.after&&e.before.status)?` <code>${esc(e.before.status)} → ${esc(e.after.status)}</code>`:''}</div>
        <div class="muted">${E(e.reason||'')}</div></div>`).join('')+`</div>`)
  + panel(T('panel.state'), five({state:Tt('p7.state'), blocking:GT.blocking_reason, missing:GT.missing_evidence, owner:GT.owner, next:GT.next_allowed_transition}));

  /* P8 Failure & Safety — inherited from v0.1 */
  $('s-p8').innerHTML=
    panel(T('p8.title'),
     (V1.failures.cases||[]).map(c=>`<div class="note ${c.verdict==='UNSAFE'?'bad':''}">
        ${pill(c.verdict,c.verdict==='UNSAFE'?'stop':'ok')} <b>${E(c.case)}</b>
        <div class="muted" style="margin-top:4px"><i>${T('p8.wrong')}</i> ${E(c.what_was_done_wrong)}</div>
        <div style="margin-top:3px">${E(c.explanation)}</div></div>`).join('')
     +`<div class="note">${T('p8.note')}</div>`)
  + panel(T('p8.add'), `<div class="note">${T('p8.addnote')}</div>`)
  + ((V2.real15.retired_projections||[]).length?panel(T('p8.retired'),
     (V2.real15.retired_projections||[]).map(r=>`<div class="note warn">
        ${pill('RETIRED','dim')} <b><code>${esc(r.tx)}</code></b> · ${esc(r.retired_by)}
        <div style="margin-top:4px">${T('p8.retiredwas')} ${E(r.was)}</div>
        <div class="muted" style="margin-top:3px">${E(r.why)}</div>
        <div class="muted" style="margin-top:3px">${T('p8.retiredkept')} ${E(r.kept_as)}</div></div>`).join('')
     +`<div class="note">${T('p8.retirednote')}</div>`):'')
  + panel(T('panel.state'), five({state:Tt('p8.state'), blocking:Tt('p8.safeblock'), missing:[], owner:Tt('p8.owner'), next:[Tt('p8.next')]}));

  go(CUR);
  if($('tour').classList.contains('on')) tourShow();
}

function showTx(tx){
  const t=V2.real15.transistors.find(x=>x.tx===tx); if(!t)return;
  $('tx-detail').innerHTML=`<div class="note"><b>${esc(t.tx)}</b> · ${pill(t.routing_class)} → ${esc(t.routing.route)}${gl(t.routing.route)} (${esc(t.routing.page)})
    <div class="muted" style="margin-top:4px">${E(t.routing.control)}</div>
    <div class="muted">${Tt('p3.rgmreq')}: ${t.routing.rgm_required} · ${Tt('p3.execreq')}: ${t.routing.execution_required}
      · ${Tt('p3.upgrade')}: ${t.routing.root_cause_upgrade_allowed}</div></div>`
    +(t.conflict?`<div style="margin-top:8px">${fact(t.conflict)}</div>`:'');
}

/* 5-minute tour */
const TOUR=[['p1','t1'],['p2','t2'],['p2','t3'],['p3','t4'],['p3','t5'],['p4','t6'],
            ['p4','t7'],['p5','t8'],['p6','t9'],['p7','t10'],['p8','t11'],['p1','t12']];
let TI=0;
function tourStart(){TI=0;$('tour').classList.add('on');tourShow();}
function tourShow(){const[t,k]=TOUR[TI];go(t);
  $('tour-step').textContent=`${Tt('tour.step')} ${TI+1} ${Tt('tour.of')} ${TOUR.length}`;
  $('tour-title').textContent=Tt(k+'.h');$('tour-body').textContent=Tt(k+'.b');}
function tourNext(){TI++;if(TI>=TOUR.length){tourEnd();return;}tourShow();}
function tourEnd(){$('tour').classList.remove('on');}

paint();
</script>
</body>
</html>
