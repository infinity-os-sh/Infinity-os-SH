<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEMA MWE v0.1 — 总架构师演示版（中文版）</title>

<style>
:root{
  /* An operations console, committed to one dark world on purpose: this page is
     watched, not read. Neutrals carry a blue bias so they read as chosen rather
     than as default grey. Semantic colours are separate from the accent. */
  --bg:#0c1018;--panel:#141b26;--panel2:#1b2330;--line:#26303f;
  --ink:#e6ecf5;--dim:#8f9cb0;
  --accent:#4d8dff;--ok:#34d399;--warn:#f0b429;--stop:#f0685f;--hold:#a78bfa;
  --syn:#ff9d3d;--real:#4d8dff;
  --ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
       "Hiragino Sans GB","Microsoft YaHei",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--ui);
  font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#banner{position:sticky;top:0;z-index:50;padding:10px 20px;text-align:center;font-weight:700;
  letter-spacing:.06em;font-size:12.5px;border-bottom:2px solid var(--syn);
  background:repeating-linear-gradient(45deg,#3a2409,#3a2409 12px,#452b0b 12px,#452b0b 24px);color:var(--syn)}
#banner.real{border-bottom-color:var(--real);color:#a9c9ff;
  background:repeating-linear-gradient(45deg,#0f2242,#0f2242 12px,#132a50 12px,#132a50 24px)}
header{padding:16px 20px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-size:18px;margin:0}
.sub{color:var(--dim);font-size:12px}
nav{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:8px;
  padding:10px 14px;font-size:13px;cursor:pointer;white-space:nowrap;min-height:44px;font-family:inherit}
nav button.on{background:#1d3a6b;border-color:#2f5ca8;color:#fff}
nav button:hover{color:#fff}
main{padding:16px 20px 80px;display:grid;gap:16px}
section{display:none}section.on{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel>h2{margin:0;padding:11px 14px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid var(--line);background:var(--panel2)}
.panel .body{padding:13px 14px;overflow-x:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--accent)}
.tile .n{font-size:23px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em}
.tile .l{color:var(--dim);font-size:11.5px;margin-top:2px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
tbody tr.sel{background:#1b2740}
tbody tr[data-click]{cursor:pointer}tbody tr[data-click]:hover{background:#1b1f28}
code{font-family:var(--mono);font-size:11.5px;color:#c4d2ea;letter-spacing:-.01em}
td code,th code{white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid transparent;white-space:nowrap}
.p-ok{background:#0f2e21;color:var(--ok);border-color:#1d5c43}
.p-warn{background:#33270c;color:var(--warn);border-color:#6b5318}
.p-stop{background:#331416;color:var(--stop);border-color:#6b2a2e}
.p-hold{background:#241c3d;color:var(--hold);border-color:#443a72}
.p-dim{background:#1e222b;color:var(--dim);border-color:var(--line)}
.muted{color:var(--dim)}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;margin:0}
.kv dt{color:var(--dim)}.kv dd{margin:0}
button.act{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:10px 14px;font-size:13px;cursor:pointer;margin:0 6px 6px 0;min-height:44px;font-family:inherit}
button.act:hover{border-color:var(--accent)}
button.act.primary{background:#1d3a6b;border-color:#2f5ca8}
.flow{display:flex;flex-wrap:wrap;gap:7px;align-items:stretch}
.node{flex:1 1 132px;min-width:132px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;cursor:pointer;min-height:62px}
.node:hover{border-color:var(--accent)}
.node.on{border-color:var(--accent);background:#1b2740}
.node .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim)}
.node .v{margin-top:3px;font-size:12.5px;font-weight:600;word-break:break-word}
.timeline{max-height:480px;overflow:auto;font-size:12px}
.ev{border-left:2px solid var(--line);padding:5px 0 5px 11px;margin-left:5px}
.ev.err{border-left-color:var(--stop)}.ev.human{border-left-color:var(--ok)}
.ev .t{color:var(--dim);font-size:11px}
.note{background:#1a2030;border:1px solid #2c3a57;border-left:3px solid var(--accent);
  border-radius:6px;padding:9px 12px;font-size:12.5px;color:#c4d2ea;margin:8px 0}
.note.bad{background:#2a1618;border-color:#5e2a2e;border-left-color:var(--stop);color:#f0c3c3}
.note.good{background:#12261d;border-color:#245240;border-left-color:var(--ok);color:#bfe8d5}
.empty{color:var(--dim);padding:18px 0;text-align:center}
#tour{position:fixed;right:18px;bottom:18px;left:auto;z-index:60;max-width:390px;background:#16233a;
  border:1px solid #2f5ca8;border-radius:12px;padding:15px 17px;box-shadow:0 12px 34px rgba(0,0,0,.55);display:none}
@media(max-width:720px){
  #tour{left:12px;right:12px;bottom:12px;max-width:none}
  header{padding:14px 16px 0}nav{padding:10px 16px}main{padding:14px 16px 90px}
  h1{font-size:16.5px}.tiles{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .tile .n{font-size:20px}
}
#tour.on{display:block}
#tour h3{margin:0 0 5px;font-size:14.5px}
#tour .step{color:var(--accent);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
#tour p{margin:7px 0 11px;font-size:13px;color:#cfdcf0}
input[type=file]{font-size:12.5px;color:var(--dim)}
.r15head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
</style>
</head>

<div id="banner">合成演示 / 非企业事实 — 仅用于开发与UAT演示 · 非生产环境 · 未授权15→100扩量</div>

<header>
  <div>

    ["Target_Status=UNKNOWN or no target value; UNKNOWN is not zero","目标状态为UNKNOWN或没有目标值；UNKNOWN不能视为0"],
    ["cross-basis subtraction refused; target and actual differ on metric_id, unit","拒绝跨口径相减：Target与Actual的指标或单位不一致"],
    ["Actual exceeds Target; routed to opportunity review","Actual超过Target，转入机会复核"],
    ["responsibility resolved from supplied mapping","责任根据已提供的映射解析"],
    ["no role mapping supplied for this object; responsibility is not assigned by the engine","该对象没有提供角色映射；引擎不会自行指定责任人"],
    ["is mapped LOW risk and may be dispatched","已映射为低风险，可以派发"],
    ["is mapped HIGH risk; a human A must approve","已映射为高风险，必须由人工唯一A批准"],
    ["has no ratified risk level; the engine does not guess one","没有已批准的风险等级；引擎不会自行猜测"],
    ["task issued but not accepted","任务已派发但尚未接受"],
    ["no Task was issued","没有派发Task"],
    ["idempotency key already processed","幂等键已经处理过"],
    ["The engine will not invent","引擎不会自行创造"],
    ["no evidence submitted yet","尚未提交证据"],
    ["no root cause established","尚未建立根因"],
    ["no result window has closed","结果观察窗口尚未关闭"]
  ];
  for(const [a,b] of pairs) x=x.split(a).join(b);
  return x;
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OK=['ISSUED','ACCEPTED','IN_PROGRESS','COMPLETED','RESOLVED','VERIFIED','CLOSED','AUTO ALLOWED','GAP','SAFE STOP','SAFE DEGRADATION','CONFIRMED','MATCH','AVAILABLE','READY'];
const WARN=['PENDING_APPROVAL','NEEDS_MORE','PENDING','WAITING','RESULT_PENDING','HUMAN APPROVAL REQUIRED','EXCEPTION','ASSIGNED','DIAGNOSING','EVIDENCE_SUBMITTED','POSITIVE_GAP','LEAVE'];
const STOP=['CONFLICT','STOP','REJECTED','NOT AUTHORIZED','RESPONSIBILITY_GAP','NO_BACKUP','UNSAFE'];
const HOLD=['UNKNOWN','HOLD','PROPOSAL','VISIBILITY','NOT_ISSUED','NOT_DIAGNOSED'];
function kind(s){s=String(s||'').toUpperCase();
  if(OK.includes(s))return'ok'; if(WARN.includes(s))return'warn';
  if(STOP.includes(s))return'stop'; if(HOLD.includes(s))return'hold'; return'dim';}
const pill=(t,k)=>`<span class="pill p-${k||kind(t)}" title="${esc(t)}">${esc(zh(t))}</span>`;
const panel=(title,body)=>`<div class="panel"><h2>${esc(title)}</h2><div class="body">${body}</div></div>`;

/* ---------- derived counts ---------- */
function counts(){
  const c=DATA.chain, t=r=>r.tasks||[];
  const all=c.flatMap(t);
  return {
    Stores:new Set(c.map(r=>r.store_id)).size,
    Coverage:c.filter(r=>(r.gap.diagnosis_path||[]).includes('assortment')).length,
    'Low-SPPD':c.filter(r=>(r.gap.diagnosis_path||[])[0]==='peer').length,
    Responsibility:c.filter(r=>r.responsibility&&r.responsibility.state==='RESOLVED').length,
    Ready:c.filter(r=>r.gap.root_cause&&r.responsibility&&r.responsibility.state==='RESOLVED').length,
    Issued:all.filter(x=>x.state==='ISSUED').length,
    Accepted:all.filter(x=>x.state==='ACCEPTED').length,
    'In Progress':all.filter(x=>['IN_PROGRESS','EVIDENCE_SUBMITTED'].includes(x.state)).length,
    Evidence:c.reduce((n,r)=>n+(r.evidence||[]).length,0),
    'Pending Approval':all.filter(x=>x.mode==='PENDING_APPROVAL').length,
    Exception:c.filter(r=>r.gap.state==='STOP'||(r.responsibility&&r.responsibility.state==='RESPONSIBILITY_GAP')
                          ||r.gap.class==='CONFLICT'||r.gap.class==='UNKNOWN').length,
  };
}

const NODE_DEFS=[

  ['target','目标 / 实际',r=>r.gap.class==='UNKNOWN'?'Target UNKNOWN':(r.gap.class==='CONFLICT'?'basis CONFLICT':'Target 12 · Actual '+(12-(r.gap.value??0)))],

  ['evidence','证据',r=>(r.evidence||[]).length?r.evidence.map(e=>e.type).join(', '):'none'],
  ['root','根因',r=>r.gap.root_cause||'—'],

function nodeDetail(r,key){
  const t=(r.tasks||[])[0], resp=r.responsibility, res=r.result;
  const dr=a=>{const d=DATA.decision_rights.find(x=>x.action===a);return d?d.verdict:'HUMAN APPROVAL REQUIRED';};
  const next=(machine,state)=>{const m=DATA.state_machines[machine];
    return m&&m.states[state]?m.states[state].to:[];};
  const M={
    store:{state:r.region||'—',why:'The business object under diagnosis. Synthetic identity.',
      ev:'—',owner:resp?resp.unique_a:'—',right:'GAP_DETECT → '+dr('GAP_DETECT'),next:[]},
    sku:{state:r.sku_id,why:'v0.1 runs PS08050102 only; the schema keeps multi-SKU open.',
      ev:'—',owner:resp?resp.unique_a:'—',right:'GAP_DETECT → '+dr('GAP_DETECT'),next:[]},
    target:{state:r.gap.class==='UNKNOWN'?'TARGET_UNKNOWN':(r.gap.class==='CONFLICT'?'CONFLICT':'VALID'),
      why:r.gap.reason||'Target validated against status, metric, period and unit.',
      ev:'Target evidence reference',owner:'Planning / Data',
      right:'Validation is automatic; creating a Target is not.',next:[]},
    gap:{state:r.gap.state,why:r.gap.reason||'—',ev:'Target + Actual evidence',
      owner:resp?(resp.unique_a||'UNASSIGNED'):'UNASSIGNED',
      right:'GAP_DETECT → '+dr('GAP_DETECT'),next:next('gap',r.gap.state)},
    diagnosis:{state:r.gap.root_cause_status||'NOT_DIAGNOSED',
      why:(r.gap.diagnosis_path||[]).length?'Ordered walk: '+r.gap.diagnosis_path.join(' → '):'no diagnosis has run',
      ev:'diagnosis evidence per step',owner:'HEMA / Data',
      right:'DIAGNOSIS_DRAFT → '+dr('DIAGNOSIS_DRAFT'),next:next('gap',r.gap.state)},
    resp:{state:resp?resp.state:'WAITING',
      why:resp?(resp.reason||'resolved from the supplied role mapping'):'no role mapping supplied; the engine names nobody',
      ev:'role / person / effective evidence',
      owner:resp?(resp.unique_a||'UNASSIGNED'):'Sales Ops / HR',
      right:'Responsibility is resolved, never invented.',
      next:next('responsibility',resp?resp.state:'WAITING')},
    task:{state:t?t.state:'—',why:t?(t.reason||''):'no task was created for this object',
      ev:t?'task contract + required evidence':'—',owner:resp?resp.primary_r:'—',
      right:t&&t.action?(t.action+' → '+dr(t.action)):'—',
      next:t?next('task',t.state):[]},
    evidence:{state:(r.evidence||[])[0]?r.evidence[0].state:'—',
      why:(r.evidence||[]).length?'Execution evidence closes the task only — never the business result.':'no evidence submitted yet',
      ev:(r.evidence||[]).map(e=>e.id+' ('+e.type+')').join(', ')||'—',
      owner:'Evidence Owner',right:'Evidence intake is automatic; acceptance follows CFG-009.',
      next:(r.evidence||[])[0]?next('evidence',r.evidence[0].state):[]},
    root:{state:r.gap.root_cause||'—',
      why:r.gap.root_cause?'The first cause found in the frozen ordered walk.':'no root cause established',
      ev:'diagnosis evidence',owner:'HEMA / Data',
      right:'Root cause is evidence-led; nothing is presumed.',next:[]},
    result:{state:res?res.state:'—',
      why:res?('observed '+(res.observed_change??'—')+' · verified '+(res.verified_increment??'—')
        +' — an observed change is never a verified increment'):'no result window has closed',
      ev:'business result evidence + independent verifier',owner:'Data / Business + Finance V',
      right:res?('ROI '+res.roi_status):'—',next:res?next('result',res.state):[]},
  };
  return M[key];
}

      ${e.error_code?' '+pill(e.error_code,'stop'):''}</div>
      <div class="muted">${esc(zhReason(e.reason||''))}</div></div>`;}).join('')||'<div class="empty">暂无记录</div>';
  $('s-audit').innerHTML =
    panel(`审计时间线${sel?' · '+sel.tx:''}`,
      `<div class="note">Rule <code>${esc(a.rule_version)}</code> · Config version <code>${esc(a.config_version)}</code>
        · ${mine.length} of ${a.entries.length} entries
        ${sel?`· <button class="act" onclick="SELTX=null;renderAudit()">显示全部</button>`:''}</div>
       <div class="timeline">${rows}</div>`);
}

/* ---------- REAL-15 import: ZIP + xlsx parsed locally in the browser ---------- */
const CONTRACT_CURRENT={tx:'tx',store_id:'store_id',store_name:'store_name',sku_id:'sku_id',
  gap:'operational_class',trigger:'trigger',primary:'primary_r',backup:'backup_r',unique_a:'unique_a',
  availability:'availability',business_confirm:'business_confirm',batch_identity:'batch_identity',
  cfg007:'cfg007',readiness:'readiness',task_status:'task_status',evidence_status:'evidence_status',
  required_action:'required_action',primary_id:'primary_id',backup_id:'backup_id',a_id:'a_id',
  effective:'effective_from',resp_evidence:'resp_evidence',confirmed_by:'confirmed_by',
  confirm_time:'confirm_time',confirm_ref:'confirm_ref',notes:'notes'};
const DEFS={
  Loaded:'从表头符合已声明契约的Sheet中读取的行数',
  Accepted:'Target已通过校验且Gap已计算 — 存在可计算结果',
  Pending:'当前还不可计算；不产出数值，也不自动升级状态',
  Conflict:'已明确存在冲突（身份或口径）；系统不会自动修复',
  Hold:'引擎拒绝摄取该行 — 留待人工处理',
  Ready:'该行记录的Gate均已关闭 — 这不代表Task已经派发'};
const norm=s=>String(s??'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
const colIdx=ref=>{const L=(ref||'').replace(/[^A-Za-z]/g,'').toUpperCase();let i=0;
  for(const c of L)i=i*26+(c.charCodeAt(0)-64);return i-1;};

async function inflateRaw(bytes){
  if(typeof DecompressionStream==='undefined') throw new Error('NO_DECOMPRESSION');
  const ds=new DecompressionStream('deflate-raw');
  const buf=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(buf);
}
async function readZip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let end=-1;
  for(let i=buf.byteLength-22;i>=0&&i>buf.byteLength-66000;i--){ if(dv.getUint32(i,true)===0x06054b50){end=i;break;} }
  if(end<0) throw new Error('NOT_A_ZIP');
  const n=dv.getUint16(end+10,true); let p=dv.getUint32(end+16,true);
  const files={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
    const lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
    const start=lho+30+lnlen+lelen;
    files[name]={method,data:u8.subarray(start,start+csize)};
    p+=46+nlen+elen+clen;
  }
  const out={};
  for(const [name,f] of Object.entries(files)){
    out[name]=f.method===0?f.data:await inflateRaw(f.data);
  }
  return out;
}
/* Namespaces are looked up explicitly: real workbooks bind the spreadsheet
   namespace to a prefix (<x:workbook xmlns:x="...">), so getElementsByTagName
   finds nothing. getElementsByTagNameNS matches whatever the prefix happens
   to be, which is the only reliable way to read a file we did not write. */
const NS_MAIN='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const NS_REL ='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const NS_PKG ='http://schemas.openxmlformats.org/package/2006/relationships';
const tags=(node,name)=>[...node.getElementsByTagNameNS(NS_MAIN,name)];

function parseSheets(files){
  const dec=new TextDecoder(), P=new DOMParser();
  const shared=[];
  if(files['xl/sharedStrings.xml']){
    const doc=P.parseFromString(dec.decode(files['xl/sharedStrings.xml']),'application/xml');
    for(const si of tags(doc,'si')) shared.push(tags(si,'t').map(t=>t.textContent).join(''));
  }
  const rels={};
  const relsDoc=P.parseFromString(dec.decode(files['xl/_rels/workbook.xml.rels']),'application/xml');
  for(const r of [...relsDoc.getElementsByTagNameNS(NS_PKG,'Relationship'),
                  ...relsDoc.getElementsByTagName('Relationship')])
    rels[r.getAttribute('Id')]=r.getAttribute('Target');

  const wb=P.parseFromString(dec.decode(files['xl/workbook.xml']),'application/xml');
  const sheets=[];
  for(const sh of tags(wb,'sheet')){
    const rid=sh.getAttributeNS(NS_REL,'id')||sh.getAttribute('r:id');
    let t=(rels[rid]||'').replace(/^\//,''); if(!t.startsWith('xl/')) t='xl/'+t;
    if(!files[t]) continue;
    const doc=P.parseFromString(dec.decode(files[t]),'application/xml');
    const rows=[];
    for(const row of tags(doc,'row')){
      const placed={};
      for(const c of tags(row,'c')){
        const ty=c.getAttribute('t'), v=tags(c,'v')[0], is=tags(c,'is')[0];
        let val='';
        if(ty==='s'&&v) val=shared[parseInt(v.textContent,10)]||'';
        else if(is) val=tags(is,'t').map(t=>t.textContent).join('');
        else if(v) val=v.textContent;
        placed[colIdx(c.getAttribute('r'))]=val||'';
      }
      const keys=Object.keys(placed).map(Number);
      const w=keys.length?Math.max(...keys)+1:0;
      rows.push(Array.from({length:w},(_,i)=>placed[i]??''));
    }
    sheets.push({name:sh.getAttribute('name'),rows});
  }
  return sheets;
}
function headerRow(rows,contract,min){
  for(let i=0;i<Math.min(rows.length,20);i++){
    const hits=rows[i].filter(c=>contract[norm(c)]).length;
    if(hits>=min) return i;
  } return -1;
}
function previewWorkbook(sheets){
  const rep={counts:{Loaded:0,Accepted:0,Pending:0,Conflict:0,Hold:0,Ready:0},sheets:[],rows:[]};
  let seq=0;
  for(const sh of sheets){
    const hi=headerRow(sh.rows,CONTRACT_CURRENT,8);
    const isCurrent=hi>=0&&sh.rows[hi].some(c=>['tx','readiness','business_confirm'].includes(norm(c)));
    if(!isCurrent){ rep.sheets.push({name:sh.name,usable:false,rows:0,
      reason:'no header row matches a declared contract; sheet skipped, not guessed'}); continue; }
    const headers=sh.rows[hi].map(norm);
    const unmapped=[...new Set(headers.filter(h=>h&&!CONTRACT_CURRENT[h]))];
    let read=0;
    for(const raw of sh.rows.slice(hi+1)){
      const rec={};
      headers.forEach((h,i)=>{ if(CONTRACT_CURRENT[h]) rec[CONTRACT_CURRENT[h]]=(raw[i]??''); });
      if(!Object.values(rec).some(v=>String(v).trim())) continue;
      read++; seq++; rep.counts.Loaded++;
      rep.rows.push(classifyRow(rec,seq,sh.name,rep));
    }
    rep.sheets.push({name:sh.name,usable:true,rows:read,
      reason:'headers match the REAL15_CURRENT_ACTION contract',unmapped});
  }
  return rep;
}
function classifyRow(rec,seq,sheet,rep){
  const U=k=>String(rec[k]??'').trim().toUpperCase();
  const miss=['tx','store_id','sku_id'].filter(k=>!String(rec[k]??'').trim());
  if(miss.length){ rep.counts.Hold++; return {row:seq,sheet,tx:rec.tx,outcome:'HOLD',
    store_id:rec.store_id||null,reason:'key fields missing: '+miss.join(', ')}; }
  const batch=U('batch_identity'), confirm=U('business_confirm'), cfg=U('cfg007');
  const ready=U('readiness'), task=U('task_status');
  const why=[]; let outcome;
  if(batch.includes('CONFLICT')){ outcome='CONFLICT'; rep.counts.Conflict++;
    why.push('Batch Identity '+batch+' — close the identity before anything else');
    if(ready==='HOLD') why.push('source Readiness is HOLD; the conflict is its cause'); }
  else if(ready==='HOLD'){ outcome='HOLD'; rep.counts.Hold++; why.push('source Readiness is HOLD'); }
  else { outcome='PENDING'; rep.counts.Pending++;
    if(confirm&&confirm!=='CONFIRMED') why.push('Business Confirm '+confirm+' — mapping is not Resolved');
    if(cfg==='PENDING') why.push('CFG-007 manual confirm outstanding for this Low-SPPD object');
    why.push('2027 Formal Target UNKNOWN — no Gap is computable'); }
  if(task&&task!=='NOT_ISSUED') why.push('source Task_Status is '+task);
  const readyNow=outcome==='PENDING'&&confirm==='CONFIRMED'&&!['HOLD','WAITING'].includes(ready)
    &&['N/A','CONFIRMED','YES',''].includes(cfg)&&!batch.includes('CONFLICT');
  if(readyNow) rep.counts.Ready++;
  return {row:seq,sheet,tx:rec.tx,outcome,store_id:rec.store_id,store_name:rec.store_name,
    sku_id:rec.sku_id,operational_class:rec.operational_class,trigger:rec.trigger,
    primary_r:rec.primary_r,backup_r:rec.backup_r,unique_a:rec.unique_a,
    business_confirm:rec.business_confirm,batch_identity:rec.batch_identity,cfg007:rec.cfg007,
    readiness:rec.readiness,task_status:rec.task_status,
    reason:why.join('; ')||'no blocker recorded on this row'};
}

function renderR15(){
  const body=`<div class="r15head">
      <input type="file" id="r15file" onchange="loadR15(this)"
        accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      <button class="act" onclick="clearR15()">返回合成演示</button></div>
    <div class="note">文件不会离开本机，由浏览器本地解析 — 不上传、不联网。
      这里只做<strong>校验 / 预览</strong>：不会派发任务，也不会写入或提交任何业务状态。</div>
    <div id="r15out">${R15?'':'<div class="empty">请选择 INFINITY_HEMA_REAL15_Integrated_Working_Return_v2.0_CURRENT.xlsx</div>'}</div>`;
  $('s-r15').innerHTML=panel('REAL-15 CURRENT 导入预览',body);
  if(R15) paintR15();
}
async function loadR15(input){
  const f=input.files&&input.files[0]; if(!f)return;
  $('r15out').innerHTML='<div class="empty">正在读取…</div>';
  try{
    const sheets=parseSheets(await readZip(await f.arrayBuffer()));
    R15=previewWorkbook(sheets); R15.file=f.name;
    MODE='REAL15'; banner(); paintR15();
  }catch(err){
    const nod=String(err.message)==='NO_DECOMPRESSION';
    $('r15out').innerHTML=`<div class="note bad"><strong>${nod?'This browser cannot unzip the workbook':'Could not read this file'}</strong><br>
      ${nod?'Excel import needs DecompressionStream (Chrome/Edge 105+, Safari 16.4+, Firefox 113+). The synthetic demo is unaffected — or run <code>tools/hema_real15_import.py</code> from the package for the same six counts.':esc(err.message)}</div>`;
  }
}
function clearR15(){R15=null;MODE='SYNTHETIC';renderR15();banner();}
function paintR15(){
  const c=R15.counts;
  const tiles=Object.entries(c).map(([k,v])=>`<div class="tile"><div class="n">${v}</div><div class="l">${esc(k)}</div></div>`).join('');
  const defs=Object.entries(DEFS).map(([k,v])=>`<tr><td>${pill(k.toUpperCase())}</td><td class="muted">${esc(v)}</td></tr>`).join('');
  const sheets=R15.sheets.map(s=>`<tr><td>${s.usable?pill('usable','ok'):pill('skipped','dim')}</td>
      <td><code>${esc(s.name)}</code></td><td>${s.rows}</td><td class="muted">${esc(s.reason)}
      ${(s.unmapped&&s.unmapped.length)?'<br>columns not in the contract (reported, not mapped): '+esc(s.unmapped.join(', ')):''}</td></tr>`).join('');
  const rows=R15.rows.map(r=>`<tr><td><code>${esc(r.tx||r.row)}</code></td>
      <td><code>${esc(r.store_id||'—')}</code></td><td>${esc(r.store_name||'')}</td>
      <td>${esc(r.operational_class||'')}</td><td>${pill(r.outcome)}</td>
      <td class="muted">${esc(zhReason(r.reason))}</td></tr>`).join('');
  $('r15out').innerHTML=`
    <div class="note bad"><strong>REAL-15 预览 / 尚未执行。</strong>
      没有派发任何Task。PENDING没有被升级，CONFLICT没有被自动修复，UNKNOWN没有被填成0。</div>
    <div class="tiles" style="margin:12px 0">${tiles}</div>
    <table><thead><tr><th>计数</th><th>定义</th></tr></thead><tbody>${defs}</tbody></table>
    <table style="margin-top:12px"><thead><tr><th></th><th>Sheet</th><th>行数</th><th>Why</th></tr></thead><tbody>${sheets}</tbody></table>
    <table style="margin-top:12px"><thead><tr><th>TX</th><th>门店</th><th>名称</th><th>分类</th>
      <th>结果状态</th><th>为什么停在这里</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- 5-minute guided tour ---------- */

 ['tower','经营组合','每个指标卡都是15颗合成晶体管的实时统计：门店、Coverage、低SPPD、责任、就绪、已派发、已接受、执行中、证据、待人工批准、异常。'],
 ['tower','Coverage / OOS','Coverage/OOS对象按冻结顺序诊断：生命周期 → 商品组合 → 上架 → 库存 → 供给 → 补货。请看“根因”列：如果是上游供给短缺，系统不会把责任错误归到门店。'],
 ['tower','低SPPD','低SPPD对象会与同类门店比较，并按8个维度诊断。只有真实陈列Evidence支持时，陈列才会成为Root Cause；系统不会预设。'],
 ['tx','经营晶体管','逐节点查看一颗晶体管：门店 → SKU → Target/Actual → Gap → 诊断 → 责任 → Task → Evidence → Root Cause → Result。点击任一节点查看详情。'],
 ['tx','责任网络','点击 Primary R / Backup / Unique A 节点。岗位责任长期存在，PERSON只是当前映射；没有有效映射时系统只能输出 RESPONSIBILITY_GAP，不会自行点名。'],
 ['tx','任务','点击Task节点。这里会显示动作、风险级别以及DecisionRight为什么允许或拒绝派发。'],
 ['mgr','主管视图','可以按区域或PERSON过滤。主管能看到完整Portfolio；第二个面板显示主管真正收到的是管理动作，而不是重复收到执行者的Execution Task。'],
 ['tx','证据','点击TX001的Evidence节点。执行证据只能关闭Task；Result仍保持PENDING，ROI仍BLOCKED_ON_FINANCE。完成动作不等于已经证明业务结果。'],
 ['dr','高风险动作必须人工批准','依次点击 PRICE_CHANGE、BUDGET_RELEASE_OR_TRANSFER、SOMETHING_NOT_CONFIGURED。未配置动作默认进入PENDING APPROVAL，绝不会被推定为低风险。'],
 ['fail','异常安全演示','四个故意制造的故障：重复事件、错误Store_ID、缺PERSON、高风险动作。每个都必须以SAFE STOP或SAFE DEGRADATION结束。'],
 ['audit','审计回放','按时间顺序查看每一次状态变化，包括执行者、规则版本、配置版本、Evidence和批准链。被拒绝的动作也会被记录，违规尝试与成功动作一样可见。'],
 ['r15','REAL-15 真实输入预览','加载您自己的CURRENT工作簿，文件仅在本机解析。系统会给出Loaded / Accepted / Pending / Conflict / Hold / Ready，并解释每颗为什么停在当前状态；蓝色横幅代表 REAL-15 PREVIEW / NOT EXECUTED。'],
];
let TI=0;
function tourStart(){TI=0;$('tour').classList.add('on');tourShow();}
function tourShow(){const [tab,title,body]=TOUR[TI];go(tab);
  $('tour-step').textContent=`第 ${TI+1} 步 / 共 ${TOUR.length} 步`;
  $('tour-title').textContent=title; $('tour-body').textContent=body;}
function tourNext(){TI++; if(TI>=TOUR.length){tourEnd();return;} tourShow();}
